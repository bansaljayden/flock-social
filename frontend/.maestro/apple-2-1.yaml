# Apple Guideline 2.1 review recording, driven end to end with nobody at the
# keyboard. Shot numbers match APPLE-2.1-REPLY.md section B. Run by the
# ios-review-recording workflow in codemagic.yaml, which boots a Simulator,
# starts xcrun simctl recordVideo, and passes these env vars:
#
#   REVIEW_EMAIL_A, REVIEW_EMAIL_B, REVIEW_PASSWORD
#       Two FIXED, pre-verified, persistent accounts Jayden created once by
#       ordinary signup and confirmed by email. Everything that needs a
#       verified account (create flock, invite, friend request, chat, vote,
#       photo, report, block) happens on these two. They are never deleted.
#   REVIEW_EMAIL_C, REVIEW_PASSWORD_C
#       A per-run throwaway minted from the build number. It is never
#       verified, and that is fine: it exists only for the signup shot and the
#       account-deletion shot. An unverified account can log in and delete
#       itself; it cannot create flocks, invite, or befriend
#       (backend/middleware/auth.js UNVERIFIED_DENY).
#   NAME_B, NAME_C
#       Display names. NAME_B must be the name account B was signed up with,
#       because it is what the friend search, the invite list, the block sheet
#       and the Blocked accounts row show.
#   REVIEW_RUN
#       The build number. The flock is named "Review night <REVIEW_RUN>" so a
#       leftover from a failed run can never collide with the next one.
#
# Selector rules, from AUDIT-2026-09-01.md (read against Maestro's iOS driver):
#   * text only. `id:` matches nothing in a WKWebView. An aria-label REPLACES
#     the visible text for matching.
#   * no `back`: it is a no-op on iOS. In-app "Back" controls are tapped by
#     their aria-label instead.
#   * no `hideKeyboard`: on iOS it only nudges the screen centre. Forms are
#     submitted with Enter; other keyboards are closed by tapping static text
#     that stays on screen (a screen header), never a heading that can scroll
#     away behind the keyboard.
#   * every source line is quoted next to the step that uses it.
#
# What is required and what is optional: a step whose failure would lose one
# shot is `optional: true`, so one stale label costs that shot and not the
# recording. The steps that gate everything after them (the logins of A and
# B, opening the created flock's chat) are required.
#
# Run order (seven sessions; the friend request has to be accepted by B before
# A can invite B, because the chat's invite list shows friends only,
# ChatDetail.js:2040-2060 / App.js flockInviteAllFriends):
#   C   signup (shots 1-3), sign in (shot 4), log out
#   A1  send friend request to B, log out
#   B1  accept friend request, log out
#   A2  location prompt (5), create flock (6), share invite link (7),
#       invite B, vote (9), camera prompt + photo + text (11), contacts
#       prompt (11b), log out
#   B2  accept flock invite (8, the RSVP), post the message A will report,
#       log out
#   A3  report (12), block (13), blocked accounts + unblock (15), log out
#   C   delete account (16)
# Shot 10 (budget) and shot 14 (post-hangout slider) are not attempted: the
# reply calls 10 optional, and 14 needs a confirmed flock with a chosen venue.
appId: com.flockcorp.flock
---
# Permissions are left unset on purpose. The point of the recording is that
# the iOS dialogs appear in context and are accepted on camera.
- launchApp:
    clearState: true
    permissions:
      all: unset
    permissions:
      all: unset

# ---------------------------------------------------------------------------
# Shots 1-4, account C: launch to the login screen, sign up with the date of
# birth on screen, land on "Confirm your email", go back to the login form
# and sign in. Nothing in this block is allowed to end the recording: if the
# signup did not stick, C's login fails, the login screen stays up with C's
# email in it, and A's login below clears the fields (parts/login.yaml).
# ---------------------------------------------------------------------------
- assertVisible: "Welcome back"                 # LoginScreen.js:146, fresh launch shows LoginScreen (App.js authScreen default 'login')
- runFlow:
    file: parts/signup.yaml
    env:
      NAME: ${NAME_C}
      EMAIL: ${REVIEW_EMAIL_C}
      PASSWORD: ${REVIEW_PASSWORD_C}
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_C}
      PASSWORD: ${REVIEW_PASSWORD_C}
- extendedWaitUntil:
    visible: "Nest"                             # App.js tab table, label: 'Nest'; login does not require verification (auth.js "The account exists and can sign in")
    timeout: 25000
    optional: true
- runFlow:
    when:
      visible: "Nest"
    commands:
      - waitForAnimationToEnd
      - runFlow: parts/logout.yaml

# ---------------------------------------------------------------------------
# A1: A sends B a friend request. Tolerant of "already friends" (the row then
# shows a "Friends" pill instead of "Add", AddFriends.js:260) and of a request
# already pending (:262).
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_A}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
- tapOn: "You"                                  # App.js tab table, label: 'You'
- scrollUntilVisible:
    element:
      text: "Add Friends.*"                     # ProfileSettings.js:633 row; WKWebView exposes the whole button, title plus subtitle, as one label (run 5 missed the exact text)
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    text: "Add Friends.*"
    optional: true
- tapOn:
    text: "Search"                              # AddFriends.js tab; the screen does not always open on it
    optional: true
- extendedWaitUntil:
    visible: "Search by name..."                # AddFriends.js:222 placeholder, the default tab (App.js addFriendsTab 'username')
    timeout: 10000
    optional: true
- tapOn:
    text: "Search by name..."
    optional: true
- inputText: ${NAME_B}
# SearchInputLocal commits on a 120 ms debounce (App.js:4071), no Enter needed.
- extendedWaitUntil:
    visible: ${NAME_B}                          # AddFriends.js result row name
    timeout: 10000
    optional: true
# Close the keyboard by tapping the screen header, which never scrolls.
- tapOn:
    text: "Add Friends"                         # AddFriends.js:144 <h1>
    optional: true
- tapOn:
    text: "Add"                                 # AddFriends.js:264, the result row's request button
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Back"                                 # AddFriends.js:143 aria-label; this screen has no tab bar
    optional: true
- runFlow: parts/logout.yaml

# ---------------------------------------------------------------------------
# B1: B accepts the friend request. Pending requests sit at the top of Add
# Friends on every tab (AddFriends.js:168-197). Optional: already friends
# means nothing to accept.
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_B}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
- tapOn: "You"
- scrollUntilVisible:
    element:
      text: "Add Friends.*"                     # ProfileSettings.js:633 row; WKWebView exposes the whole button, title plus subtitle, as one label (run 5 missed the exact text)
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    text: "Add Friends.*"
    optional: true
- extendedWaitUntil:
    visible: "Accept friend request"            # AddFriends.js:191 aria-label
    timeout: 10000
    optional: true
- tapOn:
    text: "Accept friend request"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Back"                                 # AddFriends.js:143
    optional: true
- runFlow: parts/logout.yaml

# ---------------------------------------------------------------------------
# A2, the main session. Shot 4 for real: A logs in.
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_A}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000

# Shot 5: the location dialog, in context, with the usage string visible.
# Tapping Discover calls requestUserLocation() (App.js `tabId === 'explore' && locationEnabled`,
# locationEnabled defaults true, App.js:4629), which uses navigator.geolocation.
- tapOn: "Discover"                             # App.js tab table, label: 'Discover'
- extendedWaitUntil:
    visible: "Allow While Using App"            # iOS dialog, NSLocationWhenInUseUsageDescription (Info.plist:50)
    timeout: 15000
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
# WebKit may add its own per-origin prompt after the system one
# (AUDIT-2026-09-01.md, apple-2-1 58-61).
- tapOn:
    text: "Allow|OK"
    optional: true
- waitForAnimationToEnd

# Shot 6: create a flock. The form submits with a name alone (CreateScreen.js:160
# is the only validation). Nobody is added on this screen: one invitee turns
# it into a direct message (CreateScreen.js:156 dmTarget). B is invited from
# the chat afterwards.
- tapOn: "Nest"
- tapOn:
    text: "Start a flock"                       # App.js:12374 header button (flocks exist) or :12434 empty state; same text, either opens the create screen
    index: 0
- extendedWaitUntil:
    visible: "Start a Flock"                    # CreateScreen.js:293 <h1>
    timeout: 10000
- tapOn: "Movie night, dinner, party..."        # CreateScreen.js:328 placeholder
- inputText: "Review night ${REVIEW_RUN}"
# The name commits on a 120 ms debounce (SearchInputLocal, App.js:4071).
# Close the keyboard for real. Runs 7 to 11 (2026-09-02) all tapped Create
# Flock with the keyboard still up: on iOS a tap on a button does not take
# focus from a text field, so the day-chip tap of run 10 changed nothing, and
# the request never left the app (Railway http log). Three things that do
# close it, each optional: the keyboard's own Done bar, the Return key (the
# name field blurs on Return since this commit), and only then the chip.
- tapOn:
    text: "Done"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: "Tonight|Tomorrow|This Weekend|Next Week"
    index: 0
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Create Flock"                     # CreateScreen.js:573 submit; NOT "Start a Flock", which is the heading
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn: "Create Flock"
- waitForAnimationToEnd
# Probes: which of these is on screen says what the tap did.
- assertVisible:
    text: "Name your plan first"                 # CreateScreen.js handleCreate: name state was empty
    optional: true
- assertVisible:
    text: "Movie night, dinner, party..."       # placeholder visible = the field is empty
    optional: true
- assertVisible:
    text: "Create Flock"                        # still on the create screen
    optional: true
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Create Flock"
          commands:
            - tapOn:
                text: "Done"
                optional: true
            - pressKey: Enter
            - waitForAnimationToEnd
            - tapOn:
                text: "Create Flock"
                optional: true
            - waitForAnimationToEnd
# The create success path opens the chat directly (App.js newlyCreatedFlockRef,
# setCurrentScreen('chatDetail')). This gates every shot below.
- runFlow: parts/open-chat.yaml

# Shot 7: invite B from the chat's invite modal, then the share sheet.
# The header controls are hidden until the "Features" pill is tapped
# (ChatDetail.js:512-527 visibility: hidden until chatNavOpen).
# Run 12 (2026-09-02) did the share sheet first: its Close closed something,
# then nothing on the page answered (B's row, the send button, the modal's
# Close, and finally "Features", which was required and ended the recording
# with B never invited). So B is invited BEFORE the share sheet, the sheet is
# last, and the block ends by getting back to a chat with "Features" on it
# even if that takes a relaunch.
- tapOn: "Features"                             # ChatDetail.js:533 aria-label
- tapOn:
    text: "Invite friends"                      # ChatDetail.js:529 aria-label (nav) / :912 (empty chat), either opens the modal
    index: 0
- extendedWaitUntil:
    visible: "Share invite link (no account needed)"   # ChatDetail.js:2014
    timeout: 10000
    optional: true
# The modal lists friends only (App.js flockInviteAllFriends from getFriends);
# each row is one <button> holding the avatar's initial, the name and an "Add"
# tag (App.js renderFlockInviteRow), so WKWebView's label for it starts with
# the initial, not the name: run 13 (2026-09-02) had A and B as friends
# (GET /api/friends confirmed it) and "${NAME_B}.*" still matched nothing.
# Match the name anywhere in the label, and give the list time to load,
# since the share-link section renders before getFriends returns.
# Tapping a row selects it and the send button appears reading "Invite 1 Friend"
# (ChatDetail.js:2151); the modal closes itself after the send.
- extendedWaitUntil:
    visible: ".*${NAME_B}.*"
    timeout: 10000
    optional: true
- tapOn:
    text: ".*${NAME_B}.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Invite 1 Friend"
    optional: true
- waitForAnimationToEnd
# Reopen the modal for the share link if the send closed it.
- runFlow:
    when:
      notVisible: "Share invite link (no account needed)"
    commands:
      - tapOn:
          text: "Features"
          optional: true
      - tapOn:
          text: "Invite friends"
          index: 0
          optional: true
      - extendedWaitUntil:
          visible: "Share invite link (no account needed)"
          timeout: 8000
          optional: true
- tapOn:
    text: "Share invite link (no account needed)"       # needs POST /:id/invite-link, verified account
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Close"                               # iOS share sheet close; if navigator.share was unavailable the URL is shown inline and this is a no-op
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Close"                               # ChatDetail.js:1977 the modal's own close
    optional: true
- waitForAnimationToEnd
# Back to a chat with its header. A sheet that is still up takes a swipe down;
# a page that stopped answering after the native sheet takes a relaunch, which
# keeps the session and lands on Nest, and open-chat.yaml finds the flock again.
- runFlow:
    when:
      notVisible: "Features"
    commands:
      - swipe:
          start: "50%,25%"
          end: "50%,92%"
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Features"
    commands:
      - launchApp:
          permissions:
            all: unset
      - waitForAnimationToEnd
      - runFlow: parts/open-chat.yaml
- extendedWaitUntil:
    visible: "Features"
    timeout: 10000

# Shot 9: the vote panel. There is no venue search in it (AUDIT-2026-09-01.md,
# apple-2-1 111-122); it offers current votes, "Popular Chains Nearby" rows
# (each a button whose tap casts a vote, ChatDetail.js:1805 handleQuickVote,
# fed by the location granted in shot 5) and "Share a venue to chat". Tapping a
# chain row is the vote; the header then reads "1 vote cast".
- tapOn: "Features"                             # ChatDetail.js:533
- tapOn:
    text: "Vote on a venue"                     # ChatDetail.js:528 aria-label
    optional: true
- extendedWaitUntil:
    visible: "Vote for a Venue"                 # ChatDetail.js:1727 <h2>
    timeout: 10000
    optional: true
- extendedWaitUntil:
    visible: "Popular Chains Nearby"            # ChatDetail.js:1802
    timeout: 15000
    optional: true
- tapOn:
    text: ".*Vote"                              # ChatDetail.js:1805-1822 chain row: name, type, then the "Vote" pill
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Close"                               # ChatDetail.js:1730 aria-label
    optional: true
- waitForAnimationToEnd

# Shot 11: the camera dialog in context, then a photo message and a text
# message. The Simulator has no camera: after the dialog the app either shows
# the viewfinder (closed here) or toasts and closes it itself (App.js:9723
# 'Could not access camera'), so the dialog wait is optional. A library photo
# is sent instead; the workflow seeded one with simctl addmedia.
- tapOn: "Take a photo"                         # ChatDetail.js:1255 aria-label -> openCameraViewfinder (getUserMedia)
- extendedWaitUntil:
    visible: "OK|Allow"                         # iOS dialog, NSCameraUsageDescription (Info.plist:73)
    timeout: 15000
    optional: true
- tapOn:
    text: "OK|Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Close the camera"                    # App.js:17456 aria-label on the viewfinder
    optional: true
- waitForAnimationToEnd
- tapOn: "Choose a photo from your library"     # ChatDetail.js:1258 aria-label -> hidden <input type=file accept="image/*">
- waitForAnimationToEnd
- tapOn:
    text: "Photo Library"                       # WebKit's file action sheet
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Photo,.*"                         # PHPicker cells are labelled "Photo, <date>"; the nav title "Photos" does not match
    timeout: 15000
    optional: true
- tapOn:
    text: "Photo,.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Choose|Done|Add"                     # single-select returns on its own; kept for a picker that asks
    optional: true
- extendedWaitUntil:
    visible: "Send photo"                       # ChatDetail.js:1225 aria-label on the preview bar
    timeout: 15000
    optional: true
- tapOn:
    text: "Send photo"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Type a message...|Message"                    # ChatDetail.js:1269
    optional: true
# If the input answers to neither text, it still sits at the bottom of
# the chat above the home indicator; tap where it is.
- runFlow:
    when:
      notVisible: "Type a message...|Message"
    commands:
      - tapOn:
          point: "45%,92%"
          optional: true
- inputText: "Here for the recording"
- pressKey: Enter                               # ChatDetail.js:1269 onKeyDown Enter -> sendChatMessage
- tapOn:
    text: "Send message"                        # ChatDetail.js:1276 aria-label; disabled once the text is gone, so a no-op after Enter
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Back"                                 # ChatDetail.js:487 aria-label; the chat has no tab bar
    optional: true

# ---------------------------------------------------------------------------
# B2: B accepts the flock invite (shot 8, the RSVP in this app) and posts the
# message A will report. Optional as a block: if the invite never reached B,
# the report and block shots are lost, not the recording.
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_B}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
- tapOn: "Nest"
- extendedWaitUntil:
    visible: "Review night ${REVIEW_RUN}"       # App.js:14497 pending invite <h2>{f.name}
    timeout: 15000
    optional: true
- tapOn:
    text: "Accept invite"                       # App.js:14519 aria-label
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Review night ${REVIEW_RUN}"     # App.js:14598 flock card <h2>, card opens chatDetail (App.js:14571)
    commands:
      - tapOn:
          text: "Review night ${REVIEW_RUN}"
          index: 0
      - runFlow: parts/open-chat.yaml
      - tapOn:
          text: "Type a message...|Message"              # ChatDetail.js:1269
          optional: true
      # If the input answers to neither text, it still sits at the bottom of
      # the chat above the home indicator; tap where it is.
      - runFlow:
          when:
            notVisible: "Type a message...|Message"
          commands:
            - tapOn:
                point: "45%,92%"
                optional: true
      - inputText: "message from B for the report shot"
      - pressKey: Enter                         # ChatDetail.js:1269 onKeyDown Enter
      - tapOn:
          text: "Send message"                  # ChatDetail.js:1276
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Back"                           # ChatDetail.js:487
          optional: true
- runFlow: parts/logout.yaml

# ---------------------------------------------------------------------------
# A3: report B's message (shot 12), block B from the same sheet (13), then
# Blocked accounts and unblock (15).
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_A}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
- tapOn: "Nest"
- tapOn:
    text: "Review night ${REVIEW_RUN}"          # App.js:14598 flock card <h2>
    index: 0
- runFlow: parts/open-chat.yaml
# The bubble is a <button> with no aria-label whose content is the message
# (ChatDetail.js:1053-1085); tapping it opens the reaction row with "Report".
- tapOn:
    text: "message from B for the report shot"
    optional: true
- tapOn:
    text: "Report"                              # ChatDetail.js:1124 aria-label
    optional: true
- tapOn:
    text: "Report this message"                 # ModerationSheet.js:204, "Report " + NOUNS.flock_message (:42)
    optional: true
- tapOn:
    text: "Spam"                                # ModerationSheet.js:24
    optional: true
- tapOn:
    text: "Submit report"                       # ModerationSheet.js:245, enabled once a reason is picked
    optional: true
- extendedWaitUntil:
    visible: "Report sent"                      # ModerationSheet.js:252, the 'reported' step (a userId is present)
    timeout: 15000
    optional: true
# One tap blocks and closes the sheet (ModerationSheet.js:146-159 confirmBlock);
# there is no second confirm. The block also removes the friendship
# (backend/routes/moderation.js:558), which is what lets the next run's friend
# shots happen again.
- tapOn:
    text: "Block ${NAME_B}"                     # ModerationSheet.js:256
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Back"                                 # ChatDetail.js:487
    optional: true

# Shot 15: blocked accounts list, unblock B, list empties. There is no
# "Settings" control on the You tab; the row is "Blocked accounts"
# (ProfileSettings.js:670). The row button reads "Unblock <name>"
# (ProfileSettings.js:447 aria-label); the confirm button is the plain
# "Unblock" (ProfileSettings.js:466), which only exists once the dialog is up.
- tapOn: "You"
- scrollUntilVisible:
    element: "Blocked accounts.*"                 # ProfileSettings.js:675 row; its label is the title plus the count, so the whole label is matched (every cleanup pass missed the exact text)
    direction: DOWN
    centerElement: true
    timeout: 8000
    optional: true
- tapOn:
    text: "Blocked accounts.*"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: ${NAME_B}                          # ProfileSettings.js:434 row <p>
    timeout: 10000
    optional: true
- tapOn:
    text: "Unblock ${NAME_B}"                   # ProfileSettings.js:447
    optional: true
- tapOn:
    text: "Unblock"                             # ProfileSettings.js:466 confirm
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Back"                                # ProfileSettings.js:198 subscreen back -> You tab
    optional: true
- runFlow: parts/logout.yaml

# ---------------------------------------------------------------------------
# Shot 16: delete account C on camera, landing on the logged-out screen.
# Unverified accounts may delete themselves. Optional as a block: if C never
# existed the recording still ends cleanly on the login screen.
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_C}
      PASSWORD: ${REVIEW_PASSWORD_C}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
    optional: true
- runFlow:
    when:
      visible: "Nest"
    commands:
      - tapOn: "You"
      - scrollUntilVisible:
          element: "Delete account.*"       # ProfileSettings.js:812 row; WKWebView exposes the whole button as one label (runs 5 and 7 never opened the dialog on the exact text)
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          text: "Delete account.*"
          index: 0                              # only the row exists before the dialog opens
      - waitForAnimationToEnd
      # Run 5 (2026-09-02): the first "Delete account" match on the You screen is
      # not always the row, and the dialog never opened. Try the next matches
      # until the dialog heading is on screen.
      - runFlow:
          when:
            notVisible: "Delete your account?"
          commands:
            - tapOn:
                text: "Delete account"
                index: 1
                optional: true
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: "Delete your account?"
          commands:
            - tapOn:
                text: "Delete account"
                index: 2
                optional: true
            - waitForAnimationToEnd
      # The password input is labelled by <label htmlFor="delete-password">
      # "Your password" (ProfileSettings.js:861); index 0 is the label, which
      # focuses the input through htmlFor, so either index works.
      - tapOn:
          text: "Your password"
          optional: true
      - inputText: ${REVIEW_PASSWORD_C}
      - tapOn:
          text: "Type DELETE to confirm"          # ProfileSettings.js aria-label on the confirm input; it replaces the placeholder for matching
          optional: true
      - tapOn:
          text: "DELETE"                        # ProfileSettings.js:891 placeholder (the empty input's value)
          optional: true
      - inputText: "DELETE"
      # Return closes the keyboard (ProfileSettings.js onKeyDown blur on the
      # confirm input, added after run 12: a tap on the heading never blurred
      # the field, so the keyboard kept covering the buttons). The confirm
      # button carries its own accessible name so no index guessing is needed.
      - pressKey: Enter
      - waitForAnimationToEnd
      - tapOn:
          text: "Delete account, permanently"   # ProfileSettings.js confirm button aria-label
          optional: true
      - tapOn:
          text: "Delete account"
          index: 2
          optional: true
      - extendedWaitUntil:
          visible: "Welcome back"               # ProfileSettings.js:906 onLogout(sessionEndCopy('account_deleted')) -> LoginScreen
          timeout: 20000
          optional: true

# ---------------------------------------------------------------------------
# Shot 11b, LAST on purpose: the contacts screen. Runs 14 and 15 (2026-09-02)
# both ended here: on iOS 18 and later the contacts request puts up a
# two-step access UI, and its second step is drawn by a system process that
# Maestro cannot read; it stayed over the app through a relaunch and a
# clean-state reinstall. The workflow keeps contacts granted for the whole
# recording, but a clean-state launch reinstalls the app and can wipe that
# grant, so this shot goes at the very end where nothing depends on the
# screen coming back: shots 8, 12, 13, 15 and 16 are already on tape.
# "Contacts" is a tab that only renders on native (AddFriends.js:131);
# "Check my contacts" (AddFriends.js:511) calls Contacts.requestPermissions()
# (services/contacts.js) only when the permission is still undecided.
# ---------------------------------------------------------------------------
- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_A}
      PASSWORD: ${REVIEW_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
    optional: true
- tapOn: "You"
- scrollUntilVisible:
    element:
      text: "Add Friends.*"                     # ProfileSettings.js:633 row; WKWebView exposes the whole button, title plus subtitle, as one label (run 5 missed the exact text)
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    text: "Add Friends.*"
    optional: true
- tapOn:
    text: "Contacts"                            # AddFriends.js:131 tab label
    optional: true
- scrollUntilVisible:
    element: "Check my contacts.*"                # AddFriends.js:511
    direction: DOWN
    timeout: 5000
    optional: true
- tapOn:
    text: "Check my contacts.*"
    optional: true
# Run 14 (2026-09-02): with permissions left unset the tap put up something
# that matched neither "Allow.*" nor "Back", and the logout's "You" tap
# failed against it. iOS 18 and later ask in two shapes: an alert with
# "Select Contacts", "Allow Full Access" and "Don't Allow", or a picker sheet
# with "Continue", "Done" and "Cancel". Answer whichever is up, then make
# sure the app's own screen is back before the logout.
- extendedWaitUntil:
    visible: "Allow.*|Select Contacts.*|Continue|OK"   # iOS dialog, NSContactsUsageDescription (Info.plist:119)
    timeout: 15000
    optional: true
- tapOn:
    text: "Allow Full Access|Allow"
    index: 0
    optional: true
- tapOn:
    text: "Allow.*"
    index: 0
    optional: true
- tapOn:
    text: "Continue|OK"
    optional: true
- waitForAnimationToEnd
# Second step of the iOS 18+ flow, if it is readable: full access first.
- tapOn:
    text: "Allow Full Access|Allow.*"
    index: 0
    optional: true
- tapOn:
    text: "Select Contacts.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Done|Cancel"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Contacts on Flock|No .*|.*contacts.*"   # whichever state the tab landed in, for the log
    optional: true
# No logout here: this is the end of the take, and a required tap against
# a sheet that outlived the app is what ended runs 14 and 15.
