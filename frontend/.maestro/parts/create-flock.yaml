# Create a flock and land in its chat. Env: FLOCK_NAME.
#
# Lifted verbatim from the shot 6 block of apple-2-1.yaml, which is the only
# version of this that has ever worked on a Simulator, along with the comments
# that record why each step is there. Nothing here is new; it is shared so the
# demo flows stop assuming a flock already exists.
#
# WHY THE DEMO NEEDS IT. Build 37 got the person flow through the crossover,
# through login and onto Nest for the first time, and then failed in
# open-chat.yaml. The log says why in one line: `Assert that (Optional)
# "Start a Flock" is visible COMPLETED` -- that is the EMPTY STATE. The review
# account holds no flock, so there was no chat to open, and open-chat.yaml is a
# recovery helper, not a creator. It was written for apple-2-1.yaml, which
# creates a flock first.
#
# It is also what the video is supposed to show. Beat 4 of NARRATION-v2.md is
# "create, invite, RSVP", so a demonstration that silently opens an existing
# chat would not match its own narration.
#
# The form submits with a name alone (CreateScreen.js:160 is the only
# validation). Nobody is added here on purpose: one invitee turns the flock
# into a direct message (CreateScreen.js:156 dmTarget).
appId: com.flockcorp.flock
---
# THE TAB BAR CAN BE UNDER SOMETHING WHEN THIS PART STARTS, and this tap is
# required, so when it is, the run ends here. Build 64 died exactly here:
# `Element not found: Text matching regex: Nest` at step 85, six and a half
# minutes in, immediately after the Discover part.
#
# WHAT IS COVERING IT IS NOT KNOWN YET. The two Close taps visible in that
# run's step list are this repo's own -- the Discover part has two by design,
# one for the results list and one for the venue sheet -- so they are not
# evidence of anything. The candidates are the results list, the venue sheet
# and the map itself; the failure dump added to codemagic.yaml in the same
# change prints the screen's own text next time, which answers it outright.
#
# Every step below is guarded on Nest being absent, so a healthy run does none
# of them and films nothing extra. The order is least invasive first: the
# sheet's own Close, then the results list's own Map, then a tap on the map
# itself, which dismisses a card by tapping the backdrop behind it.
- runFlow:
    when:
      notVisible: "Nest"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Nest"
    commands:
      - tapOn:
          text: "Map"
          optional: true
      - waitForAnimationToEnd
# RUN 65 SAYS IT IS NOT A COVERED TAB BAR. The two guards above both fired
# (step 86 Close, step 89 Map), so Nest was genuinely absent, and it was still
# absent at step 94. A sheet on top would have left the tab bar in the
# hierarchy underneath it; nothing was there to find. So the app is on a screen
# that does not draw a tab bar at all, which on this tab means currentScreen is
# not 'main' -- the create screen and the flock detail screen are both like
# that, and a stray tap on a "Start Flock" button inside an event card would
# put us on the first one. Those screens have a Back.
- runFlow:
    when:
      notVisible: "Nest"
    commands:
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Nest"
    commands:
      # The upper middle of the screen is the map itself on Discover and the
      # scrim on any sheet over it. Nothing there is a control.
      - tapOn:
          point: "50%,35%"
          optional: true
      - waitForAnimationToEnd
- tapOn: "Nest"
- tapOn:
    text: "Start a flock"                       # App.js:12374 header button (flocks exist) or :12434 empty state; same text, either opens the create screen
    index: 0
- extendedWaitUntil:
    visible: "Start a Flock"                    # CreateScreen.js:293 <h1>
    timeout: 10000
- tapOn: "Movie night, dinner, party..."        # CreateScreen.js:328 placeholder
# THE KEYBOARD'S OWN TUTORIAL. The first time a text field takes focus on a
# fresh Simulator, iOS draws "Speed up your typing by sliding your finger
# across the letters to compose a word" over the keyboard with a Continue
# button, and build 48 filmed that card for the whole of the typing below.
# codemagic.yaml sets the flag that keeps it from appearing; this is the
# second line of defence, a one-shot check rather than an optional tap,
# because an optional tap on an absent element polls for up to eight seconds.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
      - tapOn: "Movie night, dinner, party..."
- inputText: ${FLOCK_NAME}
# The name commits on a 120 ms debounce (SearchInputLocal, App.js:4071).
# Close the keyboard for real. Runs 7 to 11 (2026-09-02) all tapped Create
# Flock with the keyboard still up: on iOS a tap on a button does not take
# focus from a text field, so the day-chip tap of run 10 changed nothing, and
# the request never left the app (Railway http log). Three things that do
# close it, each optional: the keyboard's own Done bar, the Return key (the
# name field blurs on Return), and only then the chip.
- tapOn:
    text: "Done"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: "Tonight|Tomorrow|This Weekend|Next Week"
    index: 0
    optional: true
- waitForAnimationToEnd
# TURN THE GROUP BUDGET ON, OR BEAT 7 CANNOT BE FILMED.
#
# CreateScreen.js:275 sends `budget_enabled: capturedBudget || undefined`, so a
# flock created with a name alone has budgetEnabled FALSE. ChatDetail.js:2792
# then gates the whole budget panel on `hasBudget`, so "What's your budget
# tonight?" never renders, the chat's cash-pool strip
# (`flock.budgetEnabled && budgetStatus`) never appears either, and the demo's
# required wait for that prompt fails. The anonymous budget is the feature the
# narration spends its longest beat on; a demonstration that cannot reach it is
# not worth filming.
#
# The control is a `role="switch"` button whose aria-label is its `label` prop
# (App.js:11571), so the text to match is "Shared cash pool" and not the
# "Group budget" heading beside it.
# Build 53 died here: "Element not found: Shared cash pool" after eight seconds
# of scrolling on a runner that took twice its usual time for every flow. The
# toggle is unconditional in the form (CreateScreen.js), so the only way it is
# missing is that the form has not finished laying out yet. A wait for it,
# then the scroll, with the patience a slow machine needs.
- extendedWaitUntil:
    visible: "Shared cash pool"
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element: "Shared cash pool"                 # CreateScreen.js:643 <Toggle label>
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn: "Shared cash pool"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Create Flock"                     # CreateScreen.js:573 submit; NOT "Start a Flock", which is the heading
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn: "Create Flock"
- waitForAnimationToEnd
# Probes: which of these is on screen says what the tap did.
- assertVisible:
    text: "Name your flock first"                # CreateScreen.js handleCreate: name state was empty
    optional: true
- assertVisible:
    text: "Movie night, dinner, party..."       # placeholder visible = the field is empty
    optional: true
- assertVisible:
    text: "Create Flock"                        # still on the create screen
    optional: true
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Create Flock"
          commands:
            - tapOn:
                text: "Done"
                optional: true
            - pressKey: Enter
            - waitForAnimationToEnd
            - tapOn:
                text: "Create Flock"
                optional: true
            - waitForAnimationToEnd
