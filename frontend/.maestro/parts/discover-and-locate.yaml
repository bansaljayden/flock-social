# Open Discover, answer the location prompt, and let the venue list load.
#
# TWO REASONS THIS IS NOT OPTIONAL, and the first one is invisible until it
# bites.
#
# 1. IT IS WHERE userLocation COMES FROM. App.js:8270 `loadPopularVenues`
#    opens with `if (!userLocation) return`, so with no location the vote
#    panel's "Popular Chains Nearby" section never populates and the demo's
#    required wait for that heading, and the row tap under it, both fail. A
#    fresh Simulator launched with clearState has no stored
#    flock_user_lat/lng, so the only way to get a fix is to ask for one:
#    tapping Discover calls requestUserLocation() (App.js `tabId === 'explore'
#    && locationEnabled`, locationEnabled defaults true, App.js:4629), which
#    uses navigator.geolocation and raises the iOS dialog.
#
#    apple-2-1.yaml has always done this, at shot 5, and says so at its shot 9:
#    the chain rows are "fed by the location granted in shot 5". The demo flow
#    was written without it and would have died at the vote panel with an empty
#    list, which reads in a log as a missing element rather than a missing
#    permission.
#
# 2. IT IS BEAT 5 OF THE NARRATION. "The crowd card" is the model's whole
#    visible surface, and it lives on this screen.
#
# The dialog itself is no longer part of this: the launch block grants location
# up front (see the permissions note in demo-person.yaml), so the app never
# asks. What this part still does is open the tab and let the venues land.
appId: com.flockcorp.flock
---
- tapOn: "Discover"                             # App.js tab table, label: 'Discover'
# NO WAIT FOR THE PERMISSION DIALOG. Location is granted in the launch block
# (`location: inuse`), so the dialog never appears, and a 20-second wait for it
# was 20 seconds of Maestro polling the accessibility tree for nothing.
#
# AND NO WAIT FOR A CROWD LABEL. The 30-second wait that used to sit here was
# for "busy", "Quiet" or "Packed" on the map, and the map pins carry no such
# text, so it never matched once and ran to its timeout on every take: fifty
# seconds of every recording spent watching a loaded screen. Both waits are
# gone, and the take is that much shorter.
#
# What replaces them is a wait that MATCHES and so stops the moment it does:
# the results button appears once Places has answered (App.js
# "All {n} results"), which is also the state the vote panel needs, since it
# reads the same cache this populates.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'All \d+ results'
    timeout: 30000
    optional: true
- waitForAnimationToEnd
# THE MODEL'S NUMBER, ON CAMERA. Beat 5 of the narration is "this is a real
# venue, and this number is my own model predicting how busy it will be at
# this hour", and the heat map alone has no number on it. The results list
# does: every row carries the crowd pill, "Crowd level 62 out of 100, Steady"
# in the accessibility tree and the figure with its word on screen (App.js
# search results, `crowdLabel` / `(est.)`). So the list is opened, held long
# enough to read, and closed again with its own back control, whose accessible
# name is the one word "Map".
#
# Optional throughout: a shot, not a gate. If Places answered with nothing the
# button is not there and the take carries on to the flock.
- tapOn:
    text: 'All \d+ results'                     # App.js "All {n} results"
    optional: true
- extendedWaitUntil:
    visible: '[\s\S]*Crowd level \d+ out of 100[\s\S]*'
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Map"                                 # App.js results header, back to the map
    optional: true
- waitForAnimationToEnd
