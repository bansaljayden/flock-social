# Cross from the signup screen to the login screen. Safe to call from anywhere:
# every step is guarded, so on a screen that is already the login form, or on
# any screen that is neither, this does nothing.
#
# WHY THIS EXISTS. App.js:21052 decides the opening screen:
#
#   return (window.Capacitor?.isNativePlatform?.() && !hasToken) ? 'signup' : 'login';
#
# On NATIVE with no stored token that is 'signup'. On the web it is 'login',
# which is where the long-standing assumption that a fresh launch shows the
# login form came from; apple-2-1.yaml still carries it in a comment. Every
# launchApp on a Simulator with no session therefore lands on SIGNUP, including
# the relaunch inside login.yaml, so the crossover has to live somewhere both
# can reach.
#
# Two separate defects were paid for one build at a time before this file read
# the way it does; both fixes are load-bearing and neither is obvious.
#
# 1. THE PAGE DOES NOT SCROLL, AN INNER DIV DOES. Measured on the real DOM at
#    390x844: document.scrollingElement has scrollHeight 844 against clientHeight
#    844, while .auth-root is 981 against 844. AuthShell.js:241-244 gives
#    .auth-root `height: 100dvh; overflow-y: auto`, so the whole auth screen is
#    an inner scroller inside a body that is exactly viewport height. The footer
#    "Sign in" sits at top 913, below the fold, further still on native where the
#    Apple button also renders. `scrollUntilVisible` had nothing to scroll and,
#    being optional, gave up silently. An explicit swipe is a real touch drag and
#    WebKit applies those to the overflow container under the finger.
#
# 2. SOMETHING IS ON TOP OF THE BUTTON. From build 34's bundle, after the swipe
#    was fixed:
#
#      Tapping on element: accessibilityText=Sign in, bounds=[257,772][317,816]
#      Try tapping at (287, 794) using hierarchy based logic for wait
#      Tapping at (287, 794) using screenshot based logic for wait
#      Something have changed in the UI judging by screenshot (d=0.01635473)
#
#    The selector matched and Maestro aimed at the button's exact centre. The
#    run failed anyway and the tap changed nothing.
#
#    THE FIRST EXPLANATION FOR THAT WAS WRONG AND IS LEFT HERE SO IT IS NOT
#    REACHED FOR AGAIN. It read the two tap lines as a retry
#    (`retryTapIfNoChange` defaults to true) whose second delivery hit login's
#    "Create an account" at x 168-306, y 754-798 and bounced back to signup. The
#    coordinates really do overlap, so it was plausible. Build 35 set
#    `retryTapIfNoChange: false`, both tap lines appeared ANYWAY, and the run
#    failed identically. That was not the mechanism, and a build was spent
#    finding out.
#
#    Build 35's failure hierarchy carried what build 34's did not: a
#    `role="dialog"` analytics consent bar at [12,681][390,828], sitting over
#    the footer, with (287, 794) in its dead space to the right of both its
#    buttons. The tap hit the overlay. Maestro called it a success because the
#    element it matched is genuinely in the hierarchy; it is simply underneath,
#    and a view hierarchy does not say what is on top of what.
#    dismiss-consent.yaml answers the bar before this part touches anything.
#
#    `retryTapIfNoChange: false` is kept: it is a real field of
#    YamlElementSelector, one tap is all this needs, and it removes a variable.
appId: com.flockcorp.flock
---
- runFlow:
    when:
      visible: "Create your account"             # SignupScreen.js:240 <h1>
    commands:
      # BEFORE ANYTHING ELSE. The analytics bar covers [12,681][390,828] at
      # 402x874, and the footer "Sign in" is at [257,772][317,816] -- underneath
      # it. Build 35 aimed correctly at (287, 794), hit the bar's dead space and
      # did nothing, which reads in the log as a tap that succeeded.
      - runFlow:
          file: dismiss-consent.yaml
      # Travel needed is ~140px on web and ~200px on native; one swipe covers
      # it and the second is slack. A swipe that hits the end of the container
      # is a no-op, not an error.
      - swipe:
          start: 50%, 75%
          end: 50%, 35%
      - swipe:
          start: 50%, 75%
          end: 50%, 35%
      - waitForAnimationToEnd
      # AGAIN, as late as possible. ConsentBanner renders synchronously from
      # index.js so the call above should already have caught it, but the bar
      # is the one thing known to sit on top of this exact button and a second
      # guarded call costs nothing when it is already answered.
      - runFlow:
          file: dismiss-consent.yaml
      # Leaves a line in the debug log naming what the swipe revealed. The
      # button carries its label as an accessibility label and NOT as text
      # (hierarchy at build 34: accessibilityText=Sign in, text=None), which is
      # the same rule AUDIT-2026-09-01.md records for aria-labels; Maestro
      # matches it either way.
      - assertVisible:
          text: "Sign in"
          optional: true
      - tapOn:
          text: "Sign in"                        # SignupScreen.js:516 -> onSwitchToLogin
          retryTapIfNoChange: false
          optional: true
      - waitForAnimationToEnd
