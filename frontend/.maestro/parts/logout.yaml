# Sign the current account out and land on the login screen. Must be called
# from a screen that has the tab bar (Nest, Discover, Plans, Messages, You).
# The chat and Add Friends screens have no tab bar; tap their "Back" first
# (ChatDetail.js:487, AddFriends.js:143).
appId: com.flockcorp.flock
---
# If something native is still over the app (a permission sheet nobody
# answered, a picker), the tab bar is not reachable. A relaunch keeps the
# session and lands on Nest, so try that once before the required tap.
# Screens without a tab bar (the chat, Add Friends, a settings subscreen)
# have a "Back" control; take it first, then relaunch if that was not it.
- runFlow:
    when:
      notVisible: "You"
    commands:
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "You"
    commands:
      - launchApp:
          permissions:
            all: unset
            contacts: allow
      - waitForAnimationToEnd
      # Every launch leaves permissions unset, which also resets what an earlier
      # launch granted, so a relaunch after the Discover session brings the iOS
      # location alert straight back over the app (run 20, 2026-09-02: two
      # relaunches in a row, neither the tab bar nor the login form ever visible).
      # Answer whatever alert is up before looking for anything of ours.
      - tapOn:
          text: "Allow While Using App|Allow Once"
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
      - waitForAnimationToEnd
- tapOn: "You"                                  # App.js tab table, label: 'You'
# The button is labelled "Sign out" (it said "Log out" until the app settled on
# one verb). "Sign out everywhere" sits directly above it and also ends up on
# the login screen, but it revokes the account's sessions on every device, so
# it must never be the one tapped here. Maestro's text match is a whole-string,
# case-insensitive regex (Filters.textMatches -> regex.matches), so "Sign out"
# cannot match "Sign out everywhere". Keep it free of ".*" and other wildcards.
# signInVocabulary.test.js checks this selector against the real label.
- scrollUntilVisible:
    element: "Sign out"                         # ProfileSettings.js:866
    direction: DOWN
    timeout: 15000
- tapOn: "Sign out"
# Sign out calls onLogout() directly, no confirm dialog (ProfileSettings.js:861).
- extendedWaitUntil:
    visible: "Welcome back|Plan the night"                     # LoginScreen.js:303, endSession sets authScreen to 'login'
    timeout: 15000
