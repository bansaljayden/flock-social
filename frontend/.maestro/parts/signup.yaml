# Sign up one account from the login screen. Env: NAME, EMAIL, PASSWORD.
# The date of birth is an <input type="date">, which iOS renders as a native
# picker rather than a keyboard field, so it is set by opening the picker and
# scrolling the year wheel to 2008. That is the one step in the whole
# recording most likely to want a first-run adjustment, and every tap in it
# is optional so the debug output shows exactly which one missed. The step
# after it is not optional: the signup must land on the Nest tab, which only
# happens if the server accepted the date.
appId: com.flockcorp.flock
---
- tapOn: "Create an account"
- assertVisible: "Create your account"
- tapOn: "What your friends call you"
- inputText: ${NAME}
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "At least 8 characters"
- inputText: ${PASSWORD}
# Maestro's hideKeyboard fails against WKWebView inputs on the Simulator
# ("Couldn't hide the keyboard", first run 2026-09-01). Tapping static text is
# the dismissal Maestro itself recommends; the heading is always on screen.
- tapOn: "Create your account"

# Date of birth.
- tapOn:
    id: "signup-dob"
- waitForAnimationToEnd
# iOS opens a calendar popover; tapping its month-year header switches it to
# wheels, where the year can be scrolled to.
- tapOn:
    text: ".* 20[0-9][0-9]"
    index: 0
    optional: true
- scrollUntilVisible:
    element:
      text: "2008"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "2008"
    optional: true
- tapOn:
    text: "Done"
    optional: true
# Close the popover by tapping the heading, which is always on screen.
- tapOn:
    text: "Create your account"
    optional: true

# The tap worked on the first run, but the login form's submit was lost below
# the fold after the keyboard closed, so the same insurance applies here.
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
    optional: true
- tapOn: "Create account"
- extendedWaitUntil:
    visible: "Nest"
    timeout: 25000
