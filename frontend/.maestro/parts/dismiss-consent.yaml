# Answer the analytics consent bar, and take the privacy-preserving answer.
#
# ConsentBanner.js renders from index.js on every surface, whenever
# `consentUnanswered()` is true. Every demo take launches with `clearState: true`,
# which wipes the stored answer, so it is up on EVERY run. It is a
# `role="dialog"` fixed to the bottom of the screen and at the Simulator's
# 402x874 it occupies [12,681][390,828].
#
# THAT RECTANGLE IS ON TOP OF THINGS THE FLOWS NEED. Build 35's and build 36's
# failure hierarchies both put the signup footer's "Sign in" button at
# [257,772][317,816], entirely inside it, with (287, 794) -- the centre Maestro
# correctly aimed at -- landing in the bar's dead space to the RIGHT of both its
# buttons ("No thanks" [29,769][123,813], "That's fine" [130,769][226,813]). The
# tap hit the overlay and did nothing, and Maestro called it a success, because
# the element it matched is genuinely in the hierarchy. It is simply underneath,
# and a view hierarchy does not say what is on top of what. The bar also covers
# the strip the tab bar sits in, so this is not only a crossover problem, and it
# would sit in the footage of every frame besides.
#
# MAESTRO ANCHORS ITS TEXT REGEXES, AND THE FIRST VERSION OF THIS FILE DID NOT.
# `Filters.textMatches` calls `regex.matches(value)`, which is Kotlin's
# whole-string match, so a bare substring never matches anything. This file
# first shipped with `visible: "Analytics choice"` against an accessibility
# label of "Analytics choice, web dialog", so the guard SKIPPED on build 36
# without ever testing whether the bar was there, and cost a build. That is the
# same rule the venue and person flows already obey with `.*You voted for.*` and
# `.{12,}Vote`; it just is not written down anywhere. It is now.
#
# It is answered "No thanks" on purpose. Declining is free by that component's
# own design -- nothing is gated and the bar does not come back -- and a
# recording should not opt a demo account into analytics to get through a
# screen.
#
# Idempotent and safe to call anywhere, including twice in a row: if the bar is
# not up, nothing matches and the whole block is skipped.
appId: com.flockcorp.flock
---
- runFlow:
    when:
      visible: ".*Analytics choice.*|.*Can we count anonymous page views.*"
    commands:
      - tapOn:
          text: "No thanks"                      # ConsentBanner.js:40 -> answer('no')
          retryTapIfNoChange: false
          optional: true
      - waitForAnimationToEnd
