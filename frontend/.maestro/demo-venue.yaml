# Demonstration video, venue side. Congressional App Challenge, Oct 2026.
#
# DELIBERATELY SHORT. the maintainer's instruction 2026-09-08: "The user flow should be
# a lot bigger than the venue flow." Target is about 30 seconds of a 2:45 cut
# against 1:45 for the person side. This flow exists to prove the second half
# of the product is real, not to tour it.
#
# This half has NEVER been filmed. The Apple 2.1 recording never opened the
# owner dashboard once.
#
# Env:
#   DEMO_VENUE_EMAIL, DEMO_VENUE_PASSWORD
#       An account whose `role` is 'venue_owner' (or 'admin'). THIS IS NOT AN
#       ORDINARY ACCOUNT and the flow cannot create one: the row that opens the
#       dashboard is rendered only for those roles
#       (ProfileSettings.js:680), and role is set server-side. If this account
#       is a plain user the You tab simply will not have the row, and the flow
#       ends at the first required wait below with the reason on screen.
#
# Selector rules inherited from AUDIT-2026-09-01.md: text only, no `id:`, no
# `back`, no `hideKeyboard`, and an aria-label REPLACES visible text on iOS.
appId: com.flockcorp.flock
---
- launchApp:
    clearState: true
    permissions:
      all: unset
      contacts: allow
# THE FIRST SCREEN ON A FRESH SIMULATOR IS SIGNUP, NOT LOGIN (2026-09-08).
#
# Build 6a9fedb7 lost both flows here, each waiting the full 90 seconds for
# "Welcome back" and then failing the run. App.js:21052 decides the opening
# screen:
#
#   return (window.Capacitor?.isNativePlatform?.() && !hasToken) ? 'signup' : 'login';
#
# On NATIVE with no stored token that is 'signup', and `clearState: true`
# guarantees no stored token, so a fresh Simulator can never show the login
# form first. On the web it is 'login', which is where the wrong assumption
# came from; apple-2-1.yaml still carries it in a comment that says a fresh
# launch shows LoginScreen.
#
# So: wait for EITHER screen, then cross to login if we landed on signup.
- extendedWaitUntil:
    visible: "Welcome back|Create your account"   # LoginScreen.js:164 / SignupScreen.js:240
    timeout: 90000
- runFlow:
    when:
      notVisible: "Welcome back"
    commands:
      # THE LINK IS BELOW THE FOLD. Build 6a9ff24e got this far and then failed
      # the wait underneath: it saw the signup screen, tapped, and never reached
      # the login form. Both "Sign in" buttons call onSwitchToLogin
      # (SignupScreen.js:301 and :516) so the selector was right, but they live
      # in `auth-foot` at the BOTTOM of the form, off-screen at phone height. An
      # `optional: true` tap that matches nothing does not fail; it silently
      # does nothing, which is why the flow carried on to die one step later
      # with a message about the login screen rather than about the tap.
      # MEASURED 2026-09-08, real DOM at 390x844 (iPhone height):
      #
      #   document.scrollingElement  scrollHeight 844 == clientHeight 844
      #   .auth-root                 scrollHeight 981  > clientHeight 844
      #   the footer "Sign in"       top 913, i.e. 69px BELOW the fold
      #
      # The DOCUMENT does not scroll. AuthShell.js:241-244 gives .auth-root
      # `height: 100dvh; overflow-y: auto`, so the whole screen is an inner
      # scrolling div inside a body that is exactly viewport height. A scroll
      # aimed at the page scrolls nothing, `scrollUntilVisible` gives up, and
      # because it was optional it gave up SILENTLY -- which is why builds
      # 6a9ff24e, 6a9fedb7 and 6a9ff829 all died 30 seconds later on the login
      # screen instead of here on the tap. On native it is worse than the 69px
      # above: AppleSignInButton renders on iOS only (it returns null on web,
      # so the measurement above does not include it) and pushes the footer
      # roughly another 60px down.
      #
      # An explicit swipe is a real touch drag, and WebKit applies those to
      # whatever overflow container is under the finger, so this moves
      # .auth-root where a page scroll could not. Two of them: the travel
      # needed is only ~140px on web and ~200px on native, so one is enough
      # and the second is slack for the taller native form. A swipe that hits
      # the end of the container is a no-op, not an error.
      - swipe:
          start: 50%, 75%
          end: 50%, 35%
      - swipe:
          start: 50%, 75%
          end: 50%, 35%
      - waitForAnimationToEnd
      # Leaves a line in the log naming what the swipe actually revealed, so a
      # future failure here says which of the two it was.
      - assertVisible:
          text: "Sign in"
          optional: true
      - tapOn:
          text: "Sign in"                         # SignupScreen.js:516 / :301, both call onSwitchToLogin
          optional: true
      - waitForAnimationToEnd
      # Second door, in case the first tap landed on a disabled submit rather
      # than the footer link: the prompt text next to it is unique to the footer.
      - runFlow:
          when:
            notVisible: "Welcome back"
          commands:
            - tapOn:
                text: 'Already have an account\?|Signed up before\?'
                optional: true
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Welcome back"                     # LoginScreen.js:164
    timeout: 30000

- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${DEMO_VENUE_EMAIL}
      PASSWORD: ${DEMO_VENUE_PASSWORD}
- extendedWaitUntil:
    visible: "Nest"
    timeout: 30000

# ---------------------------------------------------------------------------
# SHOT 1 - the same account crosses into the venue product.
#
# Worth filming as a transition rather than cutting to the dashboard: it shows
# the two halves are one app and one login, which is the point a judge would
# otherwise miss. The door is in the You tab, and it exists because the welcome
# screen used to promise a switch "in your profile" and there was none
# (App.js openVenueDashboard).
# ---------------------------------------------------------------------------
- tapOn:
    text: "You"                                 # tab bar
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Venue dashboard"                  # ProfileSettings.js:680, role-gated row
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    text: "Venue dashboard"
- extendedWaitUntil:
    visible: "Analytics"                        # VenueDashboard.js:220 tab label
    timeout: 30000

# ---------------------------------------------------------------------------
# SHOT 2 - THE LIVE CAPACITY CONTROL. The strongest venue shot in the product.
#
# This is the owner overriding the model in real time: they set how full the
# room actually is, and users see that number instead of the forecast, labelled
# as the venue's own. It expires by itself so nobody has to remember to turn it
# off. Film the slider moving.
#
# NOTE FOR THE EDIT: the forecast card BELOW this one will read "The forecast
# couldn't load". That is not a defect. routes/venueDashboard.js does a live
# Google Places Details lookup on the venue's google_place_id, and a demo venue
# that is not a real Google listing can never resolve. Frame the shot on the
# capacity control, or cut before the forecast card. Do not fake the forecast.
# ---------------------------------------------------------------------------
- assertVisible:
    text: "How full are you compared to your capacity?"   # VenueDashboard.js:263
- tapOn:
    text: "How full is your venue compared to its capacity, 0 to 100 percent"  # :302 aria-label on the slider
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Set live number|Update live number"  # VenueDashboard.js:326
    optional: true
- waitForAnimationToEnd

# ---------------------------------------------------------------------------
# SHOT 3 - promotions and events, the owner's own surfaces.
# Both may be empty on a fresh account; the empty states are named so the flow
# does not stall waiting for content that was never created.
# ---------------------------------------------------------------------------
- tapOn:
    text: "Promotions"                          # VenueDashboard.js:228
- waitForAnimationToEnd
- assertVisible:
    text: ".*"                                  # either a promo row or "No promotions yet. Create your first one!" (:1462)
    optional: true
- tapOn:
    text: "Events"                              # :229
- waitForAnimationToEnd
- assertVisible:
    text: ".*"                                  # or "No events yet. Create your first one!" (:1630)
    optional: true

# ---------------------------------------------------------------------------
# SHOT 4 - a review with an owner reply. The two-sided moment: a customer wrote
# it, the owner answers it, inside the same product the group used to pick the
# place.
# ---------------------------------------------------------------------------
- tapOn:
    text: "Reviews"                             # :230
- extendedWaitUntil:
    visible: "Recent Reviews"                   # VenueDashboard.js:1764
    timeout: 20000
- tapOn:
    text: "Reply"
    optional: true
- tapOn:
    text: "Your reply"                          # :1804 aria-label on the reply field
    optional: true
- waitForAnimationToEnd

# End on the dashboard so the editor has a clean tail to cut from.
- assertVisible:
    text: "Reviews|Analytics"
    optional: true
