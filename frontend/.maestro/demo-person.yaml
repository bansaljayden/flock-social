# Demonstration video, person side. Congressional App Challenge, Oct 2026.
#
# THIS IS NOT THE APPLE 2.1 FLOW AND SHOULD NOT BECOME IT. That flow was a
# compliance checklist: it spends most of its length on report, block, unblock
# and account deletion because App Review needed those behaviours proven on
# camera. A product demonstration that dwells on moderation reads as a product
# about moderation, so none of that is here.
#
# What this covers instead, in the order the video needs it:
#   1. Nest, the home screen
#   2. Vote on a venue, which is where the crowd model is visible
#   3. The anonymous budget match, which was shot 10 in the Apple flow and was
#      NEVER FILMED (the reply called it optional and the run never reached it)
#   4. The bill split
#
# Env, same accounts and the same reason as apple-2-1.yaml:
#   REVIEW_EMAIL_A, REVIEW_PASSWORD   a fixed, pre-verified, persistent account.
#                                     Budget, voting and invites all require a
#                                     verified account (middleware/auth.js
#                                     UNVERIFIED_DENY), so a throwaway will not
#                                     do here.
#   DEMO_RUN                          any string; names the flock so a leftover
#                                     from a failed take cannot collide.
#
# Selector rules are inherited from AUDIT-2026-09-01.md and are not restated:
# text only, no `id:`, no `back`, no `hideKeyboard`, and an aria-label REPLACES
# the visible text for matching on iOS. Every selector below is quoted against
# the source line it comes from, same as the Apple flow.
#
# PACING IS AN EDIT DECISION, NOT A FLOW DECISION. Do not add artificial waits
# to make the video breathe. Maestro drives the app; the editor holds the frame.
# A flow padded with waits is slower to run, costs more per Codemagic take, and
# still gives the editor the wrong pauses.
appId: com.flockcorp.flock
---
- launchApp:
    clearState: true
    permissions:
      all: unset
      contacts: allow
      # LOCATION IS GRANTED UP FRONT, and `all: unset` above is why it has to
      # be said here. Maestro applies these AFTER its clear-state reinstall,
      # so `unset` wipes the grant the build script gives the Simulator and the
      # app is back to asking. In build 40 it asked and no prompt was ever
      # drawn: CoreLocation never answered, Discover held "Finding where you
      # are", and the vote panel's nearby list stayed empty because that list
      # is fed by the granted location. The flow died there.
      #
      # A demonstration is not a permissions checklist. The Apple 2.1 flow is
      # the one that has to film the prompt being accepted, and it still does;
      # this one is about what the product DOES, and every shot after Discover
      # needs a real coordinate behind it.
      #
      # `inuse`, NOT `allow`. Location is the one permission Maestro does not
      # route through applesimutils: LocalSimulatorUtils.setLocationPermission
      # takes always / inuse / never / unset and throws on anything else, which
      # is what killed build 41 nine seconds in ("wrong argument value 'allow'
      # was provided for 'location' permission"). The docs' own example says
      # `location: allow` and it is wrong. `inuse` runs
      # `simctl privacy grant location`, which is While Using the App, which is
      # exactly what the app asks for. An explicit entry beats `all: unset`
      # above whatever order they appear in.
      location: inuse
# Cold start: the WKWebView has to load the bundle before anything paints.
# Apple run 24 asserted with no wait and died in the first seconds.
# THE FIRST SCREEN ON A FRESH SIMULATOR IS SIGNUP, NOT LOGIN (2026-09-08).
#
# Build 6a9fedb7 lost both flows here, each waiting the full 90 seconds for
# "Welcome back" and then failing the run. App.js:21052 decides the opening
# screen:
#
#   return (window.Capacitor?.isNativePlatform?.() && !hasToken) ? 'signup' : 'login';
#
# On NATIVE with no stored token that is 'signup', and `clearState: true`
# guarantees no stored token, so a fresh Simulator can never show the login
# form first. On the web it is 'login', which is where the wrong assumption
# came from; apple-2-1.yaml still carries it in a comment that says a fresh
# launch shows LoginScreen.
#
# So: wait for EITHER screen, then cross to login if we landed on signup.
- extendedWaitUntil:
    visible: "Welcome back|Create your account"   # LoginScreen.js:164 / SignupScreen.js:240
    timeout: 90000
# The analytics consent bar is up on every take, because clearState wipes the
# stored answer and ConsentBanner.js renders whenever the question is
# unanswered. It is fixed to the bottom of the screen and covers the footer AND
# the tab bar strip, so it breaks taps long before it spoils a frame. Answer it
# once, here, and it does not come back for the rest of the run.
- runFlow:
    file: parts/dismiss-consent.yaml
# A fresh Simulator with clearState has no token, so App.js:21052 opens on
# SIGNUP, not login. The crossover is shared with parts/login.yaml, whose own
# relaunch lands on the same screen for the same reason, and it carries the
# two non-obvious fixes that cost a build each: the page does not scroll (an
# inner .auth-root does), and the tap must not be retried or its second
# delivery lands on "Create an account" and bounces back here.
- runFlow:
    file: parts/signup-to-login.yaml
- extendedWaitUntil:
    visible: "Welcome back"                     # LoginScreen.js:164
    timeout: 30000

- runFlow:
    file: parts/login.yaml
    env:
      EMAIL: ${REVIEW_EMAIL_A}
      PASSWORD: ${REVIEW_PASSWORD}
# A venue-owner or admin account lands on a mode chooser, not on Nest
# (App.js:14156). Build 38's venue flow signed in perfectly as review-b and
# then failed its wait for "Nest" because Nest sits behind this screen. Guarded,
# so a plain user passes straight through.
- runFlow:
    file: parts/choose-mode.yaml
    env:
      MODE: '[\s\S]*I''m Going Out[\s\S]*'
- extendedWaitUntil:
    visible: "Nest"
    timeout: 30000

# ---------------------------------------------------------------------------
# SHOT 1 - Nest. The home screen with tonight's status and the flock list.
# Nothing to do; the camera just needs it on screen and unobstructed.
# ---------------------------------------------------------------------------
- assertVisible: "Nest"

# ---------------------------------------------------------------------------
# SHOT 2 - open a flock and vote on a venue. THIS IS THE MODEL SHOT.
#
# The crowd number and its word come from services/mlPredictor.js by way of
# crowdEngine.publishedLabel. Read the note in VIDEO-PLAN.md before filming
# this: a venue with no baseline is scored by the rule engine and its label is
# hedged to "Usually busy", which shows the model doing nothing. Film against a
# venue that has corpus coverage.
# ---------------------------------------------------------------------------
- tapOn:
    text: "Nest"
    optional: true
# CREATE THE PLAN ON CAMERA. Build 37 reached Nest here for the first time and
# then died inside open-chat.yaml, whose log named the reason in one line:
# `Assert that (Optional) "Start a Flock" is visible COMPLETED`, which is the
# EMPTY STATE. The review account holds no flock, the ".{6,}" tap above had no
# card to hit, and open-chat.yaml is a recovery helper rather than a creator --
# it was written for apple-2-1.yaml, which creates one first. This flow never
# did.
#
# Creating it here is also what the video is for: beat 4 of NARRATION-v2.md is
# "create, invite, RSVP", so the demonstration should show a plan being made
# rather than open one that happened to be lying around. The name carries
# DEMO_RUN so a leftover from a failed take cannot be picked up by mistake.
# DISCOVER FIRST, AND NOT ONLY BECAUSE IT IS BEAT 5. It is where userLocation
# comes from, and without it App.js:8270 loadPopularVenues returns immediately,
# leaving the vote panel's "Popular Chains Nearby" empty and the required tap
# under it with nothing to hit. apple-2-1.yaml has always taken the location at
# its shot 5 for exactly this reason and says so at its shot 9.
- runFlow:
    file: parts/discover-and-locate.yaml

- runFlow:
    file: parts/create-flock.yaml
    env:
      FLOCK_NAME: "Friday night out ${DEMO_RUN}"
- waitForAnimationToEnd
# The create success path opens the chat directly (App.js newlyCreatedFlockRef,
# setCurrentScreen('chatDetail')), so this normally passes on its first assert.
- runFlow:
    file: parts/open-chat.yaml

# THE HEADER RAIL IS GONE AND "Features" NEVER EXISTED HERE. ChatDetail.js:577
# says it plainly: `chatNavOpen, // unused: the header rail it opened is gone;
# the plus holds those five`. The five tiles moved into ComposerPlusSheet, which
# the composer's plus button opens (ChatInputBar.js:475, aria-label
# "More to send"). There is an aria-label="Features" in App.js:15681, but that is
# the DISCOVER header, not this screen, which is how the wrong selector looked
# right in a grep. A required tap on it would have ended the run here.
- tapOn: "More to send"                         # ChatInputBar.js:475 -> setPlusOpen(true)
- tapOn:
    text: "Vote on a venue"                     # ComposerPlusSheet.js:96/108 tile label
    optional: true
# THE SECOND DOOR TO THE SAME PANEL, because a tap that lands on nothing still
# reports COMPLETED. Build 39 died here with the composer sitting UNDER the
# keyboard: the plus was at y=796, the keyboard began at y=539, and Maestro
# taps coordinates without knowing what is over them. The composer bug itself
# is fixed (useKeyboardComposer binds its listeners before it turns WebView
# resizing off, and measures the rise that fix reveals), so the tile above is
# the path this normally takes and the path the video shows.
#
# This stays anyway. It is keyed on the PANEL rather than on the tile, which is
# the only honest test: an element in the hierarchy proves nothing about what
# is drawn over it, and `visible` cannot tell the difference. The empty state's
# own button calls setShowVotePanel(true) and loadPopularVenues() -- the same
# two things the tile does (ChatDetail.js:1996) -- so recovery lands in exactly
# the same place with no seam in the footage.
- runFlow:
    when:
      notVisible: "Vote for a Venue"
    commands:
      - tapOn:
          text: "Suggest a place"               # ChatDetail.js:1997 empty state
          optional: true
- extendedWaitUntil:
    visible: "Vote for a Venue"                 # ChatDetail.js:1727 <h2>
    timeout: 20000
# EITHER HEADING IS A PASS, and which one appears says where the list came
# from. "Popular Chains Nearby" means a real coordinate fed it. "Popular in
# Philadelphia" means the device gave nothing and the app fell back to the city
# it falls back to everywhere else, which is the state a Simulator has been in
# on every take so far: location granted, location set, and CoreLocation
# delivering nothing inside ten seconds.
- extendedWaitUntil:
    visible: '[\s\S]*Popular Chains Nearby[\s\S]*|[\s\S]*Popular in [\s\S]*'
    timeout: 20000
# NO TRAILING WILDCARD ON THIS ONE, EVER. apple-2-1.yaml:316-322 records why:
# Maestro's text match is case-INSENSITIVE as well as whole-string, so anything
# that lets the pattern end early matches the panel's own header, which reads
# "0 votes cast" and later "... You voted for X". Run 26 cast no vote at all and
# still reported COMPLETED that way. Requiring at least twelve characters and
# then ENDING at "Vote" is what excludes the header and matches only a real row,
# whose label concatenates name, category, rating, price and the pill, e.g.
# "Good Dog Bar Bar - 4.4 * - $$ Vote". A `[\s\S]*` suffix was added here
# earlier today for newline tolerance and quietly undid that; the prefix alone
# gives the tolerance.
#
# KOTLIN'S `.` DOES NOT MATCH A NEWLINE, and Maestro anchors the whole string
# (Filters.textMatches -> regex.matches). A row's accessible text is assembled
# from JSX and carries newlines and trailing space, so `.{12,}Vote` can fail on
# an element that plainly reads "... Vote" on screen. parts/open-chat.yaml
# already works around this with `Review night[\s\S]*`; the same care is
# applied to every multi-line matcher here. The target is the Popular Chains
# row, a <button> whose content ends `{Icons.vote(...)} Vote`
# (ChatDetail.js:3305/3318).
- tapOn:
    text: '[\s\S]{12,}Vote'                          # ChatDetail.js:1807 chain row button
- extendedWaitUntil:
    visible: '[\s\S]*You voted for[\s\S]*'
    timeout: 20000
# LOCK THE PLAN IN. Two reasons, and the second one is the one that would have
# quietly cost beat 8.
#
# It is a real step in the story: the vote decides the venue and somebody has
# to commit to it. The button only renders for the creator and only while the
# plan is open (`isCreator && !planLocked`, ChatDetail.js:3242), and the demo
# account created this flock, so it is here.
#
# And it is what makes the bill split reachable at all. ChatDetail.js:2937
# wraps the first "Split the Bill" button in `isConfirmedOrComplete`, and the
# second in `!hasBudget` -- which is FALSE here, because creation turned the
# budget on. So with the budget enabled and the flock still in `voting`,
# NEITHER bill-split button exists, and the tap further down would have missed
# silently and dropped beat 8 from the footage without failing the run.
- tapOn:
    text: "Confirm|Lock it in"                  # ChatDetail.js:3243
    index: 0
- waitForAnimationToEnd
# OPTIONAL, BECAUSE THE PANEL HAS USUALLY CLOSED ITSELF BY NOW.
# handleConfirmVenue calls setShowVotePanel(false) before it even sends the
# update (ChatDetail.js:1622), so the Close button this used to tap is gone the
# moment the lock lands. A required tap on it would have ended the run here --
# in the stretch no take has ever reached, which is the worst place to learn it.
- tapOn:
    text: "Close"                               # ChatDetail.js:1730 aria-label
    optional: true

# ---------------------------------------------------------------------------
# SHOT 3 - THE ANONYMOUS BUDGET MATCH. Never filmed before this flow.
#
# This is the most distinctive thing Flock does and the hardest to explain in
# words, which is exactly why it belongs on camera. The privacy property is the
# point: the client never receives an individual amount, only
# { ceiling, submissionCount, isReady, skipCount } plus the caller's own number,
# and the ceiling is withheld until at least three non-skipped submissions exist
# and is then published as a BAND rather than the raw minimum
# (routes/budget.js bandCeiling).
#
# The narration should say that while this is on screen. Do not claim the app
# hides amounts "for privacy" as a feature bullet; say what it actually does,
# which is that nobody including the group creator can see what any one person
# put in.
# ---------------------------------------------------------------------------
- tapOn:
    text: "Open group cash pool"                # ChatDetail.js:2365 aria-label on the chat banner
    optional: true
# Fallback: the same sheet is reachable from the composer's plus menu
# (ChatDetail.js:2755 onCashPool) when the banner is not showing.
- runFlow:
    when:
      notVisible: "Group Budget|Split the Bill"
    commands:
      - tapOn:
          text: "More to send"                  # ChatInputBar.js:475, not "Features"
          optional: true
      - tapOn:
          text: '[\s\S]*[Cc]ash pool[\s\S]*'
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Group Budget|Split the Bill"      # ChatDetail.js:2787 <h2>
    timeout: 20000
- extendedWaitUntil:
    visible: "What's your budget tonight?"      # ChatDetail.js:2794
    timeout: 20000
# The preset row renders as "$20", "$40", "$60+" etc from `presets`
# (ChatDetail.js:2798-2802). Tap the middle one so the shot shows a chosen
# state rather than a rail.
- tapOn:
    text: "\\$\\d+"
    index: 1
- waitForAnimationToEnd
# Submit. The button label sits under the presets and the custom field
# ("Or enter a custom amount", ChatDetail.js:2805).
- tapOn:
    text: "Submit|Set my budget|Done"
    optional: true
- waitForAnimationToEnd
# One of these is true afterwards depending on how many others have answered:
# the group number, the withheld-number explanation, or the waiting state.
- assertVisible:
    text: 'The group number is not being shown|Waiting on more answers|No group number for a flock this size|[\s\S]*budget[\s\S]*'
    optional: true

# ---------------------------------------------------------------------------
# SHOT 4 - the bill split, reached from the same sheet.
#
# THE SHEET IS SHUT BY NOW. Submitting a budget ends with setShowChatPool(false)
# (ChatDetail.js, the submit handler), so by the time the run gets here the
# money sheet has closed itself and "Split the Bill" is not on screen. The tap
# below is optional, so it would have missed in silence and beat 8 would have
# been narration over a chat screen -- a hole in the footage that no failure
# would have reported.
#
# So the sheet is reopened first, by the same two doors that opened it before:
# the chat banner, or the composer's plus. The button inside is gated on
# `isConfirmedOrComplete` (ChatDetail.js:2938), which is why the plan is locked
# in further up rather than left in voting.
- tapOn:
    text: "Open group cash pool"                # ChatDetail.js:2365 aria-label
    optional: true
- runFlow:
    when:
      notVisible: "Group Budget|Split the Bill"
    commands:
      - tapOn:
          text: "More to send"
          optional: true
      - tapOn:
          text: '[\s\S]*[Cc]ash pool[\s\S]*'
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Group Budget|Split the Bill"
    timeout: 20000
- tapOn:
    text: "Split the Bill"                      # ChatDetail.js:2939
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Create a bill split after your hangout|Split the Bill"   # ChatDetail.js:2946
    optional: true
- tapOn:
    text: "Close"
    optional: true

# ---------------------------------------------------------------------------
# Land back on Nest so the take ends somewhere the editor can cut from.
# ---------------------------------------------------------------------------
- tapOn:
    text: "Back"                                # ChatDetail.js:487 aria-label; the chat has no tab bar
    optional: true
- extendedWaitUntil:
    visible: "Nest"
    timeout: 20000
