<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ═══════════════════════════════════════════════════════════════════
         CONTENT SECURITY POLICY — the copy that reaches the iOS binary.

         There are two origins that run this app and only one of them was
         covered. frontend/vercel.json sends an enforcing CSP as an HTTP
         response header, which is www.flockcorp.com and nothing else. The
         App Store build is a Capacitor shell with `webDir: 'build'` and no
         `server.url`, so it serves this same bundle out of the app package
         over capacitor://localhost and never fetches a Vercel response at
         all. Same localStorage token, same innerHTML/setHTML sinks, same
         13-year-old audience floor, and until this tag it had no policy of
         any kind. A meta CSP is the only form that travels with the bundle.

         THIS TAG APPLIES ON THE WEB TOO, and that is the constraint that
         shapes it. When a document carries both a header policy and a meta
         policy, BOTH are enforced and the effective policy is their
         INTERSECTION — the narrower of the two wins for every directive. So
         this value is derived from vercel.json's header and is a
         SUPERSET-OR-EQUAL of it, directive for directive: every source in
         the header is here, and the only additions are the two native
         schemes, which no browser origin can ever match. The intersection on
         www.flockcorp.com is therefore exactly the header, unchanged.
         `frontend/src/__tests__/appOriginCsp.test.js` reads both out of
         source and fails if this stops being true. Do not tighten a
         directive here to harden native — tightening here narrows the WEB
         app as well. Native-only tightening belongs in a separate file, or
         nowhere.

         WHAT WAS DROPPED, and why it is not a loss:
           frame-ancestors — IGNORED in a meta policy by every browser
             (HTML-delivered policies cannot govern who frames the document).
             vercel.json still sends `frame-ancestors 'self'` for the web,
             alongside X-Frame-Options: SAMEORIGIN. A native WebView cannot be
             framed by anything, so there is nothing to lose on that side.
           report-uri / report-to / sandbox — also meta-ignored. The header
             carries none of them today; if one is ever added to vercel.json
             it stays header-only for the same reason.
         Those three are why the header is NOT redundant with this tag. The
         two are complementary and both have to stay.

         WHY capacitor://localhost AND ionic://localhost ARE SPELLED OUT.
         On native, 'self' resolves to the custom-scheme origin the WebView
         was loaded from, which is capacitor://localhost for this config
         (`ios` block in capacitor.config.ts, no `server` override, so the
         Capacitor default). Listing it literally costs nothing on the web —
         a page on https://www.flockcorp.com can never match a
         capacitor:-scheme source — and it means a WebKit build that declines
         to match 'self' against a custom scheme still loads the bundle
         instead of white-screening. ionic://localhost is the other scheme
         Capacitor has shipped as a default; it is here for the same reason.
         They are added, never substituted, so the web behaviour is untouched.

         THE TWO ENTRIES THAT LOOK REMOVABLE ON NATIVE AND ARE NOT REMOVABLE
         HERE. Native does not need https://accounts.google.com in script-src
         (useGoogleAuth.js guards the GSI web script behind isNativeIos() and
         the native path is the plugin) and it does not need
         https://www.gstatic.com (there is no service worker under
         capacitor://; push is @capacitor-firebase/messaging). Both stay
         because THE WEB NEEDS THEM: gstatic is load-bearing for
         firebase-messaging-sw.js's importScripts — dropping it does not lose
         a script tag, it makes serviceWorker.register() reject and web push
         silently stops registering anyone. Removing either from this tag
         would intersect them out of the web policy.

         `worker-src blob:` and `img-src blob: data:` are MapLibre. Without
         them the map is a blank rectangle and nothing logs an error anyone
         reads.

         This tag sits directly after <meta charset> because a meta policy
         governs only what is parsed after it, and the icon/manifest links
         below are real subresource loads.
         ═══════════════════════════════════════════════════════════════════ -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost ionic://localhost; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' capacitor://localhost ionic://localhost https://accounts.google.com https://www.gstatic.com https://us-assets.i.posthog.com; style-src 'self' capacitor://localhost ionic://localhost 'unsafe-inline'; img-src 'self' capacitor://localhost ionic://localhost data: blob: https://flock-app-production.up.railway.app https://api.maptiler.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://api.dicebear.com https://*.googleusercontent.com https://maps.googleapis.com https://www.gstatic.com; font-src 'self' capacitor://localhost ionic://localhost data:; media-src 'self' capacitor://localhost ionic://localhost; worker-src 'self' capacitor://localhost ionic://localhost blob:; child-src 'self' capacitor://localhost ionic://localhost blob:; frame-src 'self' capacitor://localhost ionic://localhost https://accounts.google.com; connect-src 'self' capacitor://localhost ionic://localhost https://flock-app-production.up.railway.app wss://flock-app-production.up.railway.app https://api.maptiler.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://us.i.posthog.com https://us-assets.i.posthog.com https://accounts.google.com https://*.googleapis.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; manifest-src 'self' capacitor://localhost ionic://localhost" />

    <!-- viewport-fit=cover is REQUIRED and must not be removed: it is what makes
         the Capacitor WebView edge to edge, so the app paints into the rounded
         screen corners like a native app instead of sitting in a letterboxed
         rectangle. It also means the WebView extends UNDER the Dynamic Island
         and the home indicator, and env(safe-area-inset-*) only reports real
         values while it is present. Honouring those insets is the app's job:
         see the SAFE-AREA CONTRACT block at the top of src/index.css. Removing
         this tag to "fix" clipped content is the wrong fix. -->
    <!-- No maximum-scale / user-scalable=no. Blocking pinch zoom fails WCAG 1.4.4
         (Resize Text) and is the only enlargement mechanism a low-vision user has
         in an app whose type is hardcoded px. Do not re-add them: if pinch zoom
         reveals a broken fixed element, fix the element. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- #0b1a2e is the launch navy. The same value is hardcoded three places on
         purpose and they must move together: the iOS LaunchScreen.storyboard
         background, `ios.backgroundColor` in capacitor.config.ts, and this tag.
         It is deliberately NOT either app theme (cream #f1ede0 / slate #0f172a):
         it only shows during the splash-to-first-paint handoff, and matching the
         splash is what makes that handoff invisible. manifest.json repeats it as
         theme_color and background_color for the same reason. -->
    <meta name="theme-color" content="#0b1a2e" />

    <!-- iOS turns bare digit runs into blue tel: links. In a planning app that
         means "9 PM", "$40", and "Fri 8:30" become tappable. This kills the
         auto-detection only; the explicit <a href="tel:911"> in the SOS sheet
         and the venue phone links keep working. -->
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="Vote on where to go, see how busy it is before you leave, and split the bill after. Flock turns the group chat argument into an actual plan. Free." />

    <!-- ═══════════════════════════════════════════════════════════════════
         SHARE PREVIEW (Open Graph + Twitter)

         These are the DEFAULT tags. One index.html is served for every route
         (CRA has no server rendering), so whatever is written here is what
         iMessage, Slack, Discord and WhatsApp show for the marketing pages.

         Invite links are the EXCEPTION and no longer fall back to this block.
         frontend/api/invite-preview.js now answers /i/<token> for the preview
         bots, via the UA-conditional rewrite in vercel.json, and returns
         "Sarah invited you to Friday Night Out" with the date, the venue and
         the going count. Verified live 2026-08-14: facebookexternalhit,
         Twitterbot, Slackbot, Discordbot, WhatsApp, Applebot and the real
         iMessage user agent all reach the function; humans still get the React
         app at the same URL. That function falls back to exactly the tags
         below whenever the token is missing, malformed, revoked, or the
         backend does not answer inside 2.5s, so this block is still the floor
         for invites and must stay generic and true.

         Rules for editing this block:
         - og:image must be an ABSOLUTE url on the canonical host. www is
           canonical; the apex 308-redirects to it, and several scrapers do not
           follow redirects when fetching an image.
         - There is deliberately NO og:url. A static one would claim every
           invite link IS the homepage, and Facebook/Messenger would then
           collapse the preview onto flockcorp.com and send the tap there
           instead of to the invite. With it absent, scrapers use the URL they
           actually fetched, which is correct on every route.
         - Every claim here has to be true of the shipping build. Voting, the
           crowd read, and bill splitting all ship. "Free" is true while
           PAYWALL_ENABLED is unset; if the paywall is ever switched on, this
           copy and the landing page change together.
         ═══════════════════════════════════════════════════════════════════ -->
    <meta property="og:title" content="Flock | Plans that actually happen" />
    <meta property="og:description" content="Vote on where to go, see how busy it is before you leave, and split the bill after. Free." />
    <meta property="og:image" content="https://www.flockcorp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Flock. Plans die in the group chat. Flock is where they happen." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flock" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flock | Plans that actually happen" />
    <meta name="twitter:description" content="Vote on where to go, see how busy it is before you leave, and split the bill after. Free." />
    <meta name="twitter:image" content="https://www.flockcorp.com/og-image.png" />
    <meta name="twitter:image:alt" content="Flock. Plans die in the group chat. Flock is where they happen." />

    <!-- Icons. The sizes below are the real contents of each file, not a wish
         list: favicon.ico is a 3-image ICO (16/32/48, verified by reading its
         directory), logo192.png is 192, apple-touch-icon.png is 180. All are the
         cream disc with the three-bird mark, so the app is recognisable at 16px
         and at 180px. If you regenerate favicon.ico, re-check these numbers. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flock" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Flock | Plans that actually happen</title>

    <!-- ═══════════════════════════════════════════════════════════════════
         STRUCTURED DATA (JSON-LD)

         Before this block the site had zero structured data on every route,
         so nothing told a search or answer engine what Flock is, who makes
         it, or that it costs nothing.

         Only SITE-LEVEL entities belong here, because this one file is the
         response for /, /about, /privacy, /terms, /i/<token> and the
         Capacitor shell alike. Every entity below is true on all of them.
         Each carries an @id anchored to the homepage, so a crawler that meets
         it on /privacy still resolves one Organization and one WebApplication
         for the whole site rather than seven copies.

         Page-SPECIFIC schema must NOT go here. The FAQ on /support is the
         obvious candidate for FAQPage and it would be wrong in this file: it
         would claim /privacy and /terms carry those same questions. That one
         belongs in src/website/SupportPage.js, injected per route.

         This same @graph is duplicated, on purpose, in api/marketing-page.js,
         which serves a static HTML rendering of the five marketing routes to
         AI crawlers that cannot execute JavaScript (UA-conditional rewrites
         in vercel.json, same pattern as the invite preview). The two copies
         are pinned to each other by src/__tests__/aiCrawlerSurface.test.js:
         edit this block and that suite tells you where the other copy is.

         Rules for editing:
         - No aggregateRating, no ratingValue, no userInteractionCount, no
           downloadCount. Flock is pre-launch. Inventing any of those is
           fabricated review markup and is a manual-action risk, not a
           shortcut.
         - The one credibility claim, `award`, is the DECA credential in the
           same words the visible site uses. Do not add anything here the
           rendered pages do not say.
         - No sameAs for the App Store. Apple ID 6781442127 is real but the
           listing 404s until Apple approves the app (checked 2026-08-14),
           and LandingPage.js keeps APP_STORE_LIVE=false for the same reason.
           Add it in the same change that flips that flag.
         - operatingSystem stays generic. The iOS build is on TestFlight, not
           the App Store, so claiming iOS here would outrun the shipping
           product.
         - The price 0 Offer is true only while PAYWALL_ENABLED is unset. If
           the paywall is ever switched on, this block, the og:description
           above and the landing page pricing section change together.
         - featureList entries must each be a feature that ships today.
         ═══════════════════════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.flockcorp.com/#organization",
          "name": "Flock",
          "legalName": "Flock Corp",
          "url": "https://www.flockcorp.com/",
          "email": "social@flockcorp.com",
          "description": "Flock makes a free group planning app that turns a group chat into an actual plan.",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.flockcorp.com/#logo",
            "url": "https://www.flockcorp.com/logo512.png",
            "width": 512,
            "height": 512,
            "caption": "Flock"
          },
          "founder": {
            "@type": "Person",
            "name": "Jayden Bansal"
          },
          "award": "1st place, PA DECA States"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.flockcorp.com/#website",
          "url": "https://www.flockcorp.com/",
          "name": "Flock",
          "description": "Vote on where to go, see how busy it is before you leave, and split the bill after.",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://www.flockcorp.com/#organization" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.flockcorp.com/#app",
          "name": "Flock",
          "url": "https://www.flockcorp.com/",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Any (runs in a web browser)",
          "browserRequirements": "Requires JavaScript.",
          "description": "Flock is a free group planning app. Start a flock, invite your people, vote on where to go, match budgets privately, and split the bill after.",
          "publisher": { "@id": "https://www.flockcorp.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          },
          "featureList": [
            "Create a group plan and collect RSVPs in one tap",
            "Vote as a group on where to go",
            "Private budget matching that shows the group a ceiling, never an individual amount",
            "Bill splitting with Venmo, Cash App and Zelle links",
            "Crowd level estimates for how busy a venue will be tonight",
            "Birdie, an assistant that answers plain-language questions about where to go",
            "Live location sharing inside the group, off by default",
            "One-tap SOS to trusted contacts"
          ]
        }
      ]
    }
    </script>
    <!-- Fraunces (display) + Hanken Grotesk (body) are self-hosted and bundled
         from src/fonts (@font-face in index.css), so they render offline inside
         the Capacitor WebView instead of relying on a CDN. Nothing render-
         blocking belongs in this head: no font CDN link, no analytics tag, no
         third-party script. Sentry and PostHog are dynamic imports in
         src/index.js and are not fetched at all unless their env keys are set.
         There is no rel=canonical here either: one static canonical would point
         /about, /privacy and /terms at the homepage and get them dropped from
         the index. Canonicals are served per route as HTTP Link headers from
         frontend/vercel.json, which is also where caching, the security headers
         and the noindex on /i/ and /admin/ live. vercel.json is validated
         against Vercel's own schema and rejects unknown keys, so it can carry
         no comments of its own; this block is its documentation. -->

    <!-- NO PRELOAD FOR THE LANDING PAGE HERO SCREENSHOT, and this was measured
         before it was decided, because the obvious move once that image got a
         WebP source was to add
           <link rel="preload" as="image" href="/screenshots/nest-dark@2x.webp"
                 type="image/webp" fetchpriority="high" />
         here to mirror the hero's <picture> in src/website/LandingPage.js.

         1. It would not buy anything, because the hero screenshot is NOT this
            page's largest contentful paint element at any width. Measured on
            an emulated Slow 4G phone (1.6 Mbps down, 150 ms RTT, 4x CPU) at
            320, 390, 768 and 1280, the LCP element is the Fraunces h1 every
            single time. The phone plate hangs under the copy, so only 77 to
            410px of it is inside the first viewport depending on width, and
            LCP scores an image on its VISIBLE area, which stays smaller than
            the headline's box at all four. The h1 is also why the Fraunces
            preload in LandingPage.js is the one that pays: the font is on the
            LCP path, the screenshot is not.
         2. It would cost something on every other route. CRA has no server
            rendering, so this one file is the response for /, /app, /signup,
            /about, /support, /privacy, /terms, /guidelines, /i/<token> and
            /admin, plus the Capacitor shell. A preload here fires on all of
            them and only one renders the landing page, so the rest pay 29 KB
            fetched and dropped and a "preloaded but not used" console warning.

         Mirroring is not what stopped this, and if the fold is ever recomposed
         so the screenshot becomes the LCP element the link above is correct as
         written: `type` on a preload link gates the fetch on format support,
         so it matches <source type="image/webp"> exactly, and a browser
         without WebP preloads nothing and still gets the PNG from the
         <picture>. Getting that wrong is what downloads both formats. Re-measure
         first, and route-scope it (LandingPage.js already preloads a font from
         module scope) rather than putting it in this shared file. -->

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
