# Codemagic CI/CD — builds the Capacitor-wrapped Flock web app into a signed iOS .ipa
# and ships it to TestFlight. Runs entirely in the cloud (no Mac needed).
#
# Capacitor 8 uses Swift Package Manager — there is NO CocoaPods / .xcworkspace.
# We archive frontend/ios/App/App.xcodeproj using the shared "App" scheme.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP IN THE CODEMAGIC UI BEFORE THE FIRST BUILD:
#
# 1. App Store Connect API key integration
#    Codemagic UI → Teams → Integrations → App Store Connect → add a key
#    (created in App Store Connect → Users and Access → Integrations).
#    Name the integration exactly:  FlockASC   (matches `app_store_connect` below).
#
# 2. Web build secrets. Create a variable group named  flock_web  and add the
#    REACT_APP_* lines listed in frontend/.env.example as Secure variables.
#    CRA inlines these at `npm run build`, so they must exist in the build env.
#
#    EVERY ONE OF THESE FAILS GREEN. A missing value never stops the archive and
#    never stops the TestFlight upload; it ships a build in which one feature
#    quietly does not exist. That is the only reason this list is written out:
#      REACT_APP_MAPTILER_KEY          the map still renders, on a generic light
#                                      CARTO basemap instead of the intended style
#      REACT_APP_GOOGLE_CLIENT_ID      Google sign-in cannot verify against the
#                                      backend, which enforces the same id
#      REACT_APP_GOOGLE_IOS_CLIENT_ID  the native Google button HIDES ITSELF
#                                      rather than shipping a button that cannot
#                                      work (useGoogleAuth.js
#                                      isGoogleSignInAvailable). Nothing on the
#                                      login screen says a provider went missing.
#      REACT_APP_FIREBASE_*            web push registration only. NATIVE push
#                                      comes from GoogleService-Info.plist below,
#                                      not from these six. One of them is read by
#                                      the plist step anyway:
#                                      REACT_APP_FIREBASE_PROJECT_ID is compared
#                                      against the plist's own PROJECT_ID, so the
#                                      web half and the native half cannot end up
#                                      naming two different Firebase projects.
#      REACT_APP_REVENUECAT_IOS_KEY    the paywall can never show, even with
#                                      PAYWALL_ENABLED set on the backend
#      REACT_APP_SENTRY_DSN            crashes inside the shell go unreported
#      REACT_APP_POSTHOG_KEY           posthog-js is never imported, no analytics
#      REACT_APP_API_URL               optional. Defaults to the Railway prod URL
#
#    Add ONLY vars the app reads. CRA's DefinePlugin emits the whole process.env
#    object, so any REACT_APP_* present in the build env is published verbatim in
#    build/static/js/*.js whether or not a line of code reads it: an unused
#    billable key in this group is an unused billable key on every visitor's
#    machine. Maps are MapTiler + MapLibre (App.js), so there is NO Google Maps
#    key here: REACT_APP_GOOGLE_MAPS_API_KEY has no consumer and must not be set.
#    Enforced by frontend/src/__tests__/noUnusedGoogleApiKey.test.js.
#    Non-REACT_APP vars the scripts below also read from this group:
#      CM_CERTIFICATE_PRIVATE_KEY   PEM private key. Pins ONE distribution cert
#                                   across builds, and the signing step fails
#                                   without it.
#      GOOGLE_SERVICE_INFO_PLIST    base64 of GoogleService-Info.plist. REQUIRED.
#                                   When it is absent the build now STOPS. It
#                                   used to write a placeholder and carry on,
#                                   which shipped TestFlight builds whose push
#                                   was dead on every device.
#      ALLOW_PUSHLESS_BUILD         set to the string true only to override that
#                                   stop and deliberately build without push.
#
# 3. Create the app record in App Store Connect (My Apps → +) with bundle id
#    com.flockcorp.flock so TestFlight submission has somewhere to land.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-capacitor:
    name: Flock iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    integrations:
      app_store_connect: FlockASC
    environment:
      groups:
        - flock_web
      vars:
        BUNDLE_ID: "com.flockcorp.flock"
        APP_STORE_APP_ID: "6781442127"   # numeric ASC app id (Flock Social) — for build-number lookup
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        PUBLIC_URL: "."   # CRA → relative asset paths for the bundled WebView origin
        CI: "false"        # don't treat CRA build warnings as errors
      node: 22             # Capacitor 8.4 CLI requires Node >= 22
      xcode: latest
    scripts:
      - name: Install web dependencies
        script: npm install --no-audit --no-fund
      - name: Build web app (relative asset paths)
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Write and verify GoogleService-Info.plist (push notifications)
        script: |
          # The plist holds a Firebase client API key, so it lives in the
          # flock_web env group (var GOOGLE_SERVICE_INFO_PLIST, base64 of the
          # file) instead of git, under the zero-keys-in-repo policy.
          #
          # THIS WAS THE MOST DANGEROUS STEP IN THE FILE. When the variable was
          # absent it wrote a placeholder plist and let the build carry on, so
          # the archive succeeded, the upload succeeded, TestFlight accepted it,
          # the app installed and ran, and push was dead on every device. The
          # only signal was one WARNING line twenty minutes up a build log that
          # nobody reads when the build is green. A shipped feature that silently
          # does nothing is worse than a red build, so the absence stops here and
          # names the variable to set.
          set -eu
          PLIST=ios/App/App/GoogleService-Info.plist

          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            if [ "${ALLOW_PUSHLESS_BUILD:-}" != "true" ]; then
              echo "PUSH CHECK FAILED: GOOGLE_SERVICE_INFO_PLIST is not set in the flock_web variable group."
              echo "This build could not deliver a single push notification on device, and neither"
              echo "the build, the upload, the install nor the app would say so."
              echo "FIX: add GOOGLE_SERVICE_INFO_PLIST to the flock_web group, as the base64 of"
              echo "     frontend/ios/App/App/GoogleService-Info.plist (PUSH-SETUP.md step 3a)."
              echo "OVERRIDE: set ALLOW_PUSHLESS_BUILD=true in the same group to build without push."
              exit 1
            fi
            # The Xcode project lists the plist in Resources, so a MISSING file
            # fails the archive outright. Write a valid placeholder (dummy ids)
            # so a deliberately push-disabled build still archives; the messaging
            # plugin fails soft at runtime and the app runs without push.
            cat > "$PLIST" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>invalid-placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.flockcorp.flock</string>
            <key>PROJECT_ID</key><string>placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ANALYTICS_ENABLED</key><false/>
          </dict></plist>
          PLIST_EOF
            echo "WARNING: ALLOW_PUSHLESS_BUILD=true, placeholder plist written, PUSH IS OFF IN THIS BUILD"
            exit 0
          fi

          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > "$PLIST" || true

          # Four questions, all cheap, none of which anything downstream asks.
          # A value pasted truncated, or with a stray character in it, decodes to
          # a file the Xcode project copies into Resources without looking at it,
          # and a plist for the wrong bundle id decodes perfectly. Firebase then
          # either refuses to configure at launch or registers the device under
          # ids belonging to another app, and APNs accepts a token registered
          # that way and never delivers to it. Both look like a working build.
          if ! plutil -lint "$PLIST" >/dev/null 2>&1; then
            echo "PUSH CHECK FAILED: GOOGLE_SERVICE_INFO_PLIST did not decode to a valid plist."
            echo "FIX: regenerate the value with  base64 -i GoogleService-Info.plist  and paste all of it."
            exit 1
          fi
          PLIST_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST" 2>/dev/null || echo "")
          if [ "$PLIST_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "PUSH CHECK FAILED: this plist is registered to bundle id '$PLIST_BUNDLE', not $BUNDLE_ID."
            echo "FIX: Firebase console, Project settings, General, the iOS app for $BUNDLE_ID, download its plist."
            exit 1
          fi
          PLIST_KEY=$(/usr/libexec/PlistBuddy -c "Print :API_KEY" "$PLIST" 2>/dev/null || echo "")
          if [ -z "$PLIST_KEY" ] || [ "$PLIST_KEY" = "invalid-placeholder" ]; then
            echo "PUSH CHECK FAILED: the decoded plist carries no usable API_KEY."
            exit 1
          fi

          # The bundle id says this plist belongs to an app CALLED
          # com.flockcorp.flock. It does not say which Firebase project that app
          # lives in, and one bundle id can be registered in several: a staging
          # project and a production project is the ordinary reason for two.
          #
          # That gap is the other half of the failure the check above was
          # written for. A plist from the wrong project decodes, lints, carries
          # the right bundle id and passes everything here. On device it
          # registers an FCM token in THAT project, APNs accepts it, and
          # backend/services/firebaseService.js sends from whichever project its
          # FIREBASE_SERVICE_ACCOUNT belongs to, so nothing is ever delivered
          # and nothing anywhere reports a failure. That is the same shape as
          # the wrong-app case and the bundle id cannot see it.
          #
          # The web half of this same variable group already names the project,
          # so ask the two halves whether they agree. Only when the web variable
          # is set: the REACT_APP_FIREBASE_* six are optional (web push only)
          # and an absent one is not evidence of a mismatch.
          #
          # WHAT THIS CAN AND CANNOT PROVE, so the next reader does not trust it
          # further than it goes. It compares two CLIENT halves. The project that
          # actually decides whether a push arrives is the one the backend's
          # FIREBASE_SERVICE_ACCOUNT belongs to, and that variable lives on
          # Railway, not in this group, so no build can read it. Both halves
          # agreeing on the wrong project still passes here and still delivers
          # nothing. Agreement is consistency, not correctness.
          #
          # And this is a CONDITIONAL check, so it has to say when it did not
          # run. A skipped check printing the same green line as a passed one is
          # the invisible failure this whole step exists to end, moved into the
          # build log: the line at the bottom names the project either way, and
          # nothing in it used to say whether anything had agreed with it.
          PLIST_PROJECT=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$PLIST" 2>/dev/null || echo "")
          if [ -z "${REACT_APP_FIREBASE_PROJECT_ID:-}" ]; then
            PROJECT_VERDICT="project '$PLIST_PROJECT', WHICH NOTHING HERE CHECKED: REACT_APP_FIREBASE_PROJECT_ID is not set in this group, so there was nothing to compare it against"
          elif [ "$PLIST_PROJECT" != "$REACT_APP_FIREBASE_PROJECT_ID" ]; then
            echo "PUSH CHECK FAILED: this plist belongs to Firebase project '$PLIST_PROJECT', but"
            echo "REACT_APP_FIREBASE_PROJECT_ID in the same variable group says '$REACT_APP_FIREBASE_PROJECT_ID'."
            echo "One of the two came from the wrong project. A device would register its token in one"
            echo "project while the server sends from the other, and every push would be accepted and"
            echo "never delivered, on a build that installs and runs perfectly."
            echo "FIX: take both from the one Firebase project the backend's FIREBASE_SERVICE_ACCOUNT"
            echo "     belongs to, then re-run this build."
            exit 1
          else
            PROJECT_VERDICT="project '$PLIST_PROJECT', which is the project REACT_APP_FIREBASE_PROJECT_ID names too"
          fi
          echo "GoogleService-Info.plist written and verified for $PLIST_BUNDLE, Firebase $PROJECT_VERDICT. PUSH IS ON IN THIS BUILD."
      - name: Set up code signing (reuse pinned cert + App Store profile)
        script: |
          keychain initialize
          # Use a PINNED private key (CM_CERTIFICATE_PRIVATE_KEY env var) so every build
          # reuses ONE distribution certificate instead of minting a new one each run
          # (Apple caps distribution certs at 3). First run creates the cert from this key;
          # later runs find and reuse it because the key matches.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CM_CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Check the fetched profile against App.entitlements
        script: |
          # ENABLING A CAPABILITY ON THE APP ID INVALIDATES EVERY PROVISIONING
          # PROFILE THAT ALREADY EXISTS. Apple says so on the save dialog, and
          # Associated Domains was enabled on com.flockcorp.flock on 2026-08-26,
          # so the first build after that is the first one that has to mint a
          # replacement. `fetch-signing-files --create` above derives the profile
          # from the App ID and normally does exactly that, but when it reuses a
          # profile that predates the capability the archive fails roughly twenty
          # minutes later, inside an xcodebuild log, with a line that names an
          # entitlement and not the step that produced the profile:
          #
          #   Provisioning profile "..." doesn't include the
          #   com.apple.developer.associated-domains entitlement.
          #
          # That is an hour of debugging for a question that can be answered in
          # one second, from files that are already on disk. So ask it here. The
          # list of entitlements is read from App.entitlements rather than typed
          # out, so this check covers whatever the app declares next as well.
          set -eu
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED=/tmp/flock-provisioning-profile.plist
          WANTED=$(plutil -convert json -o - ios/App/App/App.entitlements \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).keys()))')
          echo "App.entitlements declares: $WANTED"

          # AN EMPTY LIST IS NOT A PASS. The loop below asks one question per
          # entitlement, so with nothing to ask it asks nothing, and every
          # profile on disk gets printed as carrying every entitlement this app
          # declares, stale ones included. Measured against this script with an
          # empty App.entitlements and a stale profile planted next to a good
          # one: exit 0, and "All 2 installed profiles for com.flockcorp.flock
          # carry every entitlement this app declares."
          #
          # That is the same shape as the bug the loop below was just widened to
          # fix, one level down: a loop that runs zero times and reports success.
          # It is also reachable by the exact move the FIX text at the bottom of
          # this step tells people not to make, and by Capacitor regenerating the
          # iOS project over the file.
          if [ -z "$WANTED" ]; then
            echo "SIGNING CHECK FAILED: ios/App/App/App.entitlements declares no entitlements at all."
            echo "Nothing below would have been examined and every installed profile would have passed."
            echo "CAUSE: the file was emptied, or the iOS project was regenerated over it."
            echo "FIX: restore App.entitlements. It has to declare aps-environment for push,"
            echo "     com.apple.developer.applesignin for Guideline 4.8, and the associated-domains"
            echo "     entitlement the invite links open through."
            exit 1
          fi

          # EVERY installed profile for this bundle id is read, not the first one
          # the glob happens to return.
          #
          # This loop used to stop at the first match, and the case this step
          # exists for is exactly the case that leaves TWO on disk: a capability
          # was saved, Apple invalidated the profile that already existed, and a
          # replacement was minted beside it. fetch-signing-files installs what
          # App Store Connect holds for the id, so both arrive. Stopping at the
          # first one made the answer depend on the filename sort order of two
          # UUIDs, and `xcode-project use-profiles` picks by its own rule, so
          # half the time the check read one profile and the archive signed with
          # the other. Measured against this file's own script with two profiles
          # planted on disk: the good one sorted first, the check said the
          # profile carries every entitlement, and the stale one was still
          # installed and still reachable by the archive.
          #
          # So no profile for this id may be missing anything. That is also what
          # makes the FIX below true: deleting the stale one is the whole of it,
          # and a check that had already skipped past it could not name it.
          FOUND=0
          STALE=0
          for p in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$p" ] || continue
            security cms -D -i "$p" -o "$DECODED" 2>/dev/null || continue
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED" 2>/dev/null || echo "")
            case "$APPID" in
              *".$BUNDLE_ID") ;;
              *) continue ;;
            esac
            FOUND=$((FOUND + 1))
            echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED")"
            echo "UUID:    $(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED")"
            echo "Created: $(/usr/libexec/PlistBuddy -c 'Print :CreationDate' "$DECODED")"

            MISSING=""
            for key in $WANTED; do
              if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:$key" "$DECODED" >/dev/null 2>&1; then
                MISSING="$MISSING $key"
              fi
            done
            if [ -n "$MISSING" ]; then
              STALE=$((STALE + 1))
              echo "  STALE, missing:$MISSING"
            else
              echo "  carries every entitlement this app declares."
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "SIGNING CHECK FAILED: no provisioning profile for $BUNDLE_ID was installed."
            echo "The fetch-signing-files step above is where that went wrong, not the archive."
            exit 1
          fi

          if [ "$STALE" -gt 0 ]; then
            echo "SIGNING CHECK FAILED: $STALE of $FOUND installed profiles for $BUNDLE_ID cannot sign this app."
            echo "The archive would have failed with \"provisioning profile does not match the entitlements file\","
            echo "and it would have failed that way even if a good profile is also installed, because the"
            echo "archive does not choose the profile this check happened to read first."
            echo "CAUSE: a capability was turned on for App ID $BUNDLE_ID after that profile was created."
            echo "FIX: delete every profile marked STALE above, by name, in the Apple Developer portal"
            echo "     (Certificates, Identifiers and Profiles, then Profiles) and re-run this build."
            echo "DO NOT delete the entitlement to make this pass. Sign in with Apple is required by"
            echo "     Guideline 4.8 while Google sign-in ships, and push needs aps-environment."
            exit 1
          fi
          echo "All $FOUND installed profiles for $BUNDLE_ID carry every entitlement this app declares."
      - name: Set unique build number (TestFlight rejects duplicates)
        script: |
          # App Store Connect rejects any upload whose CFBundleVersion was used before
          # ("bundle version must be higher than the previously uploaded version").
          # The project ships pinned at CURRENT_PROJECT_VERSION = 1, so every build after
          # the first 409s at Publishing. Fix: ask ASC for the highest build number it
          # has already seen and stamp the next integer above it — bulletproof regardless
          # of Codemagic's internal counter. MARKETING_VERSION (1.0) is left untouched.
          # Auth comes from the FlockASC integration env vars already in scope.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" --platform IOS 2>/dev/null || true)
          case "$LATEST" in
            ''|*[!0-9]*)
              # Say it out loud. The lookup used to fail into LATEST=0 in
              # silence, and the only visible consequence was a 409 at
              # Publishing after a twenty minute archive, with nothing anywhere
              # in the log naming the cause. Codemagic's own counter is the
              # fallback below and is usually higher, so this is a warning
              # rather than a stop, but it has to be findable.
              echo "WARNING: the App Store Connect build-number lookup returned nothing usable."
              echo "         Falling back to Codemagic's counter. If Publishing 409s on a duplicate"
              echo "         build number, this line is why."
              LATEST=0
              ;;
          esac
          NEXT=$((LATEST + 1))
          # If Codemagic's monotonic build counter is somehow higher, prefer it.
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ] 2>/dev/null; then NEXT=$BUILD_NUMBER; fi
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Stamped CURRENT_PROJECT_VERSION = $NEXT (ASC latest: $LATEST, CM build: ${BUILD_NUMBER:-n/a})"
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: >
          xcode-project build-ipa
          --project "$XCODE_PROJECT"
          --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
