# Regenerate the public mirror (bansaljayden/flock-social) from this repo.
#
# THIS JOB RUNS tools/publish/publish-public.sh AND NOTHING ELSE. The first
# version of this file duplicated the path filter inline, and by 2026-09-01
# the duplicate had drifted fatally behind the script: it carried no
# redaction pass and no secret scan, so dispatching it would have republished
# the exact password literal the redaction list was created to erase after
# the 2026-08-25 incident. One source of truth now; the script's three gates
# (path strip, in-file redactions, the every-blob secret scan) run on every
# publish, manual or scheduled, and the scan refusing is the job failing.
#
# ENABLED ON A DAILY SCHEDULE 2026-09-01 by Jayden's decision, reversing the
# 2026-08-20 pause: the mirror exists to show the work happening, so it
# publishes once a day ("make sure we commit to the public repo at least once
# a day"), plus manual dispatch for a same-day sync. The schedule publishes
# whatever main holds; on a day with no new commits the push is a no-op
# fast-forward and the mirror simply stays put.
name: Publish public mirror

on:
  workflow_dispatch:
    inputs:
      force_renumbered:
        description: >-
          Set to "yes" ONLY when the strip list or a redaction changed and the
          whole public history is renumbered by construction, per the script's
          own doctrine. Replaces public main with force-with-lease.
        required: false
        default: "no"
  schedule:
    # 03:30 UTC daily: after the US evening's work and the 02:00 collection
    # cron, so the day's commits ride the same morning's mirror.
    - cron: "30 3 * * *"

# GITHUB_TOKEN clones THIS repository only; the mirror push uses an SSH deploy
# key, so no write scope is ever needed here. Stated so it holds regardless of
# account settings, same as .github/workflows/gitleaks.yml.
permissions:
  contents: read

concurrency:
  # Queue rather than cancel: every commit should reach the mirror, and two
  # racing pushes would fail the loser as non-fast-forward.
  group: publish-public-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # This file is itself mirrored to flock-social; without the guard it would
    # run there too and email a failure on every sync.
    if: github.repository == 'bansaljayden/Flock-app-'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # filter-repo rewrites every commit, so it needs every commit. A
          # shallow clone would silently publish a truncated history and
          # destroy the commit record this mirror exists to show.
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Run the gated publish script
        env:
          KEY: ${{ secrets.PUBLIC_MIRROR_SSH_KEY }}
          FORCE_INPUT: ${{ github.event.inputs.force_renumbered }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes"
          export PUBLISH_REMOTE="git@github.com:bansaljayden/flock-social.git"
          if [ "${FORCE_INPUT:-no}" = "yes" ]; then
            export PUBLISH_FORCE_RENUMBERED=1
          fi
          bash tools/publish/publish-public.sh
